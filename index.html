<script>
/* ============================================================
   GRAIN — a local-first plain text writing room
   Modules: Store · Docs · Editor · Analysis · Markdown · Export · UI
   No network calls. Nothing leaves the device.
   ============================================================ */
(() => {
"use strict";

/* ---------- tiny helpers ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const mod = e => isMac ? e.metaKey : e.ctrlKey;
const KEY = isMac ? "⌘" : "Ctrl";

/* ============================================================
   STORE — persistence with graceful in-memory fallback
   ============================================================ */
const Store = (() => {
  const DB = window.TypeDB || null;          // provided by db.js
  const mem = new Map();
  async function get(k) {
    if (DB) { try { return await DB.get(k); } catch { return null; } }
    return mem.has(k) ? JSON.parse(mem.get(k)) : null;
  }
  async function set(k, v) {
    if (DB) { try { return await DB.set(k, v); } catch { return false; } }
    mem.set(k, JSON.stringify(v)); return true;
  }
  async function del(k) {
    if (DB) { try { await DB.remove(k); } catch {} } else mem.delete(k);
  }
  return {
    get, set, del,
    ready: DB ? DB.ready : Promise.resolve("memory"),
    get persistent() { return DB ? DB.persistent : false; },
    get backend() { return DB ? DB.backend : "session memory - db.js is not loaded"; }
  };
})();

/* ============================================================
   MODEL
   ============================================================ */
const DEFAULTS = {
  v: 2, caretBlock: true,
  theme: "light", font: "mono", fontSize: 18, lineHeight: 1.8, measure: 68,
  letterSpacing: 0, focusOn: false, focus: "sentence", pos: false, posParts: {
    noun: true, verb: true, adj: true, adv: true, conj: true, prep: true, pron: true
  },
  markdown: true, style: false, authorship: true, autosave: true, spellcheck: true, lang: "en",
  showChrome: "auto", previewScrollLock: true
};

const state = {
  folders: {},          // id -> {id,name,parent,open}
  metas:   {},          // id -> {id,title,folder,tags,fav,pinned,created,updated,words}
  bodies:  {},          // id -> {text, origins:[]}  (loaded lazily, cached)
  activeId: null,
  settings: { ...DEFAULTS },
  mode: "write",
  dirty: new Set()
};

/* run-length coding keeps authorship cheap to store: "t120,p45,a9" */
const Origins = {
  encode(arr) {
    if (!arr || !arr.length) return "";
    const L = ["t", "p", "a"], out = [];
    let cur = arr[0], n = 1;
    for (let i = 1; i < arr.length; i++) {
      if (arr[i] === cur) n++; else { out.push(L[cur] + n); cur = arr[i]; n = 1; }
    }
    out.push(L[cur] + n);
    return out.join(",");
  },
  decode(str, len) {
    const arr = new Array(len).fill(0);
    if (!str) return arr;
    const M = { t: 0, p: 1, a: 2 };
    let i = 0;
    for (const part of str.split(",")) {
      const k = M[part[0]] ?? 0, n = +part.slice(1) || 0;
      for (let j = 0; j < n && i < len; j++, i++) arr[i] = k;
    }
    return arr;
  }
};

const Docs = {
  list() { return Object.values(state.metas); },
  byFolder(fid) {
    return this.list().filter(m => (m.folder || null) === fid)
      .sort((a, b) => (b.pinned - a.pinned) || (b.updated - a.updated));
  },
  folderChildren(pid) {
    return Object.values(state.folders).filter(f => (f.parent || null) === pid)
      .sort((a, b) => a.name.localeCompare(b.name));
  },
  async load(id) {
    if (state.bodies[id]) return state.bodies[id];
    const raw = await Store.get("type:doc:" + id);
    const text = raw?.text ?? "";
    state.bodies[id] = { text, origins: Origins.decode(raw?.origins, text.length) };
    return state.bodies[id];
  },
  create({ title = "Untitled", folder = null, text = "" } = {}) {
    const id = uid(), now = Date.now();
    state.metas[id] = { id, title, folder, tags: [], fav: false, pinned: false, created: now, updated: now, words: 0 };
    state.bodies[id] = { text, origins: new Array(text.length).fill(0) };
    state.dirty.add(id); saveIndex(); saveDoc(id);
    return id;
  },
  duplicate(id) {
    const m = state.metas[id], b = state.bodies[id] || { text: "", origins: [] };
    const nid = this.create({ title: m.title + " copy", folder: m.folder, text: b.text });
    state.bodies[nid].origins = b.origins.slice();
    state.metas[nid].tags = [...m.tags];
    saveDoc(nid); return nid;
  },
  remove(id) {
    delete state.metas[id]; delete state.bodies[id];
    Store.del("type:doc:" + id); saveIndex();
  },
  title(id) {
    const m0 = state.metas[id];
    if (m0?.customTitle) return m0.title;
    const b = state.bodies[id];
    if (!b) return state.metas[id]?.title || "Untitled";
    const first = b.text.split("\n").find(l => l.trim());
    if (!first) return state.metas[id]?.title || "Untitled";
    return first.replace(/^#{1,6}\s*/, "").replace(/[*_`>#\-]/g, "").trim().slice(0, 60) || "Untitled";
  }
};

/* ---------- persistence ---------- */
const saveIndex = debounce(() => {
  Store.set("type:index", { folders: state.folders, metas: state.metas, activeId: state.activeId });
}, 250);
const saveSettings = debounce(() => Store.set("type:settings", state.settings), 200);

function saveDoc(id) {
  const b = state.bodies[id]; if (!b) return;
  const m = state.metas[id];
  if (m) { m.words = countWords(b.text); m.title = Docs.title(id); m.updated = Date.now(); }
  Store.set("type:doc:" + id, { text: b.text, origins: Origins.encode(b.origins) });
  saveIndex();
  state.dirty.delete(id);
  setSaved(true);
}
const autosave = debounce(id => { if (state.settings.autosave) saveDoc(id); }, 700);

function countWords(t) { const m = t.trim().match(/[A-Za-z0-9'’\u00C0-\u024F]+/g); return m ? m.length : 0; }

/* ============================================================
   UNDO — snapshot stack (text + authorship + caret)
   ============================================================ */
const History = {
  past: [], future: [], last: 0,
  snap(force) {
    const b = state.bodies[state.activeId]; if (!b) return;
    const now = Date.now();
    if (!force && now - this.last < 450 && this.past.length) { this.last = now; return; }
    this.last = now;
    this.past.push({ text: b.text, origins: b.origins.slice(), sel: Ed.sel().start });
    if (this.past.length > 250) this.past.shift();
    this.future.length = 0;
  },
  apply(snap) {
    const b = state.bodies[state.activeId];
    b.text = snap.text; b.origins = snap.origins.slice();
    Ed.text = snap.text;
    Ed.pendingCaret = clamp(snap.sel, 0, snap.text.length);
    Editor.afterChange(true);
  },
  undo() {
    const b = state.bodies[state.activeId]; if (!b || !this.past.length) return;
    const cur = { text: b.text, origins: b.origins.slice(), sel: Ed.sel().start };
    let snap = this.past.pop();
    if (snap.text === cur.text && this.past.length) snap = this.past.pop();
    this.future.push(cur); this.apply(snap);
  },
  redo() {
    if (!this.future.length) return;
    const b = state.bodies[state.activeId];
    this.past.push({ text: b.text, origins: b.origins.slice(), sel: Ed.sel().start });
    this.apply(this.future.pop());
  },
  reset() { this.past.length = 0; this.future.length = 0; }
};


/* ============================================================
   DOM refs
   ============================================================ */
const app = $("#app"), ed = $("#ed"), scroll = $("#scroll"), previewEl = $("#preview"), caretEl = $("#caret"),
      canvas = $("#canvas"), topbar = $("#topbar"), statusEl = $("#status"),
      ribbon = $("#ribbon"), veil = $("#veil");

/* ============================================================
   MARKDOWN MARKS — live formatting while you write.
   Text stays plain; the markers stay visible but recede.
   ============================================================ */
function mdMarks(text) {
  const marks = [];
  const push = (s, e, cls) => { if (e > s) marks.push({ s, e, cls }); };
  let pos = 0, inFence = false;

  for (const line of text.split("\n")) {
    const start = pos, end = start + line.length;
    pos = end + 1;

    if (/^\s*```/.test(line)) { inFence = !inFence; push(start, end, "md-fence md-syntax"); continue; }
    if (inFence) { push(start, end, "md-fence"); continue; }
    if (!line.trim()) continue;

    const h = line.match(/^(\s*)(#{1,6})(\s+)/);
    if (h) {
      push(start, end, "md-h" + h[2].length);
      push(start + h[1].length, start + h[0].length, "md-syntax");
      inlineMarks(line, start, push, h[0].length);
      continue;
    }
    if (/^ {0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { push(start, end, "md-rule md-syntax"); continue; }

    const q = line.match(/^(\s*>+\s?)/);
    if (q) {
      push(start, end, "md-quote");
      push(start, start + q[1].length, "md-syntax");
      inlineMarks(line, start, push, q[1].length);
      continue;
    }
    const li = line.match(/^(\s*)([-*+]|\d+[.)])(\s+)(\[[ xX]\]\s*)?/);
    if (li && line.trim().length > li[0].trim().length) {
      const a = start + li[1].length;
      push(a, a + li[2].length, "md-marker");
      if (li[4]) push(a + li[2].length + li[3].length, start + li[0].length, "md-marker");
      inlineMarks(line, start, push, li[0].length);
      continue;
    }
    if (/^[\s|:-]+$/.test(line) && line.includes("|")) { push(start, end, "md-syntax"); continue; }

    inlineMarks(line, start, push, 0);
  }
  return marks;
}

function inlineMarks(line, start, push, from) {
  const seg = line.slice(from), base = start + from;
  const taken = [];
  const free = (s, e) => !taken.some(t => s < t[1] && e > t[0]);
  const rules = [
    [/`([^`]+)`/g, "md-code", 1, 0],
    [/\*\*\*([^*]+)\*\*\*/g, "md-strong md-em", 3, 0],
    [/\*\*([^*]+)\*\*/g, "md-strong", 2, 0],
    [/(^|[^_\w])__([^_]+)__(?!\w)/g, "md-strong", 2, 1],
    [/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, "md-em", 1, 1],
    [/(^|[^_\w])_([^_\n]+)_(?![\w_])/g, "md-em", 1, 1],
    [/~~([^~]+)~~/g, "md-del", 2, 0]
  ];
  for (const [re, cls, n, lead] of rules) {
    re.lastIndex = 0; let m;
    while ((m = re.exec(seg))) {
      const off = lead ? m[1].length : 0;
      const s = base + m.index + off, e = base + m.index + m[0].length;
      if (!free(s, e)) continue;
      taken.push([s, e]);
      push(s, e, cls);
      push(s, s + n, "md-syntax");
      push(e - n, e, "md-syntax");
    }
  }
  const lre = /(!?)\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g; let lm;
  while ((lm = lre.exec(seg))) {
    const s = base + lm.index, e = s + lm[0].length;
    if (!free(s, e)) continue;
    taken.push([s, e]);
    push(s, e, "md-link");
    const openEnd = s + lm[1].length + 1;
    push(s, openEnd, "md-syntax");
    push(openEnd + lm[2].length, e, "md-syntax");
  }
}

/* ============================================================
   Ed — the writing surface.
   The model is a plain string; the DOM is a pure function of it.
   ============================================================ */
const Ed = {
  el: ed,
  text: "",
  composing: false,
  pendingCaret: null,
  lastSel: { start: 0, end: 0 },

  /* read text back out of the DOM, whatever the browser put there */
  domText(root = ed) {
    let out = "";
    (function rec(el) {
      for (const c of el.childNodes) {
        if (c.nodeType === 3) { out += c.nodeValue; continue; }
        if (c.nodeType !== 1) continue;
        if (c.dataset && c.dataset.filler !== undefined) continue;
        if (c.nodeName === "BR") { out += "\n"; continue; }
        if (/^(DIV|P|LI|H[1-6]|BLOCKQUOTE|PRE|TR)$/.test(c.nodeName) && out && !out.endsWith("\n")) out += "\n";
        rec(c);
      }
    })(root);
    return out;
  },

  sel() {
    const s = window.getSelection();
    if (!s || !s.rangeCount) return this.lastSel;
    const r = s.getRangeAt(0);
    if (!ed.contains(r.startContainer)) return this.lastSel;
    const start = this.offsetOf(r.startContainer, r.startOffset);
    const end = r.collapsed ? start : this.offsetOf(r.endContainer, r.endOffset);
    this.lastSel = { start: Math.min(start, end), end: Math.max(start, end) };
    return this.lastSel;
  },

  offsetOf(node, off) {
    const r = document.createRange();
    r.setStart(ed, 0);
    try { r.setEnd(node, off); } catch { return 0; }
    const holder = document.createElement("div");
    holder.appendChild(r.cloneContents());
    return this.domText(holder).length;
  },

  rangeAt(start, end = start) {
    const r = document.createRange();
    const walker = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT);
    let pos = 0, a = null, b = null, n;
    while ((n = walker.nextNode())) {
      const len = n.nodeValue.length;
      if (!a && start <= pos + len) a = [n, start - pos];
      if (!b && end <= pos + len) { b = [n, end - pos]; break; }
      pos += len;
    }
    if (a) r.setStart(a[0], clamp(a[1], 0, a[0].nodeValue.length)); else r.setStart(ed, ed.childNodes.length);
    if (b) r.setEnd(b[0], clamp(b[1], 0, b[0].nodeValue.length)); else r.setEnd(r.startContainer, r.startOffset);
    return r;
  },

  setSel(start, end = start) {
    const r = this.rangeAt(start, end);
    const s = window.getSelection();
    s.removeAllRanges(); s.addRange(r);
    this.lastSel = { start, end };
  },

  render(marks) {
    const sel = this.pendingCaret !== null
      ? { start: this.pendingCaret, end: this.pendingCaret } : this.sel();
    const focused = document.activeElement === ed;
    ed.innerHTML = paint(this.text, marks) +
      (!this.text || this.text.endsWith("\n") ? '<br data-filler>' : "");
    ed.dataset.empty = this.text ? "false" : "true";
    if (focused || this.pendingCaret !== null) {
      try { this.setSel(clamp(sel.start, 0, this.text.length), clamp(sel.end, 0, this.text.length)); } catch {}
    }
    this.pendingCaret = null;
    requestAnimationFrame(() => this.caret());
  },

  /* every edit that is not raw typing goes through here */
  splice(start, end, str, caret) {
    History.snap(true);
    this.text = this.text.slice(0, start) + str + this.text.slice(end);
    this.pendingCaret = caret == null ? start + str.length : caret;
    Editor.afterChange(true);
  },
  insert(str) {
    const { start, end } = this.sel();
    this.splice(start, end, str);
  },

  /* a block caret of our own, so it reads like a typewriter's */
  caret() {
    const hide = () => { caretEl.style.display = "none"; };
    if (!state.settings.caretBlock || state.mode !== "write") return hide();
    if (document.activeElement !== ed) return hide();
    const s = window.getSelection();
    if (!s || !s.rangeCount) return hide();
    const r = s.getRangeAt(0);
    if (!r.collapsed || !ed.contains(r.startContainer)) return hide();

    let rect = r.getBoundingClientRect();
    if (!rect.height) {                       // collapsed ranges can measure empty
      const probe = r.cloneRange();
      try {
        if (r.startOffset > 0) probe.setStart(r.startContainer, r.startOffset - 1);
        else probe.setEnd(r.endContainer, Math.min(r.endOffset + 1, (r.endContainer.nodeValue || "").length));
      } catch {}
      const rr = probe.getBoundingClientRect();
      if (rr.height) rect = { left: r.startOffset > 0 ? rr.right : rr.left, top: rr.top, height: rr.height };
    }
    if (!rect.height) {
      const er = ed.getBoundingClientRect();
      rect = { left: er.left, top: er.top, height: parseFloat(getComputedStyle(ed).lineHeight) || 24 };
    }
    const box = canvas.getBoundingClientRect();
    caretEl.style.display = "block";
    caretEl.style.height = rect.height + "px";
    caretEl.style.transform = `translate(${rect.left - box.left}px, ${rect.top - box.top}px)`;
    caretEl.classList.remove("blink"); void caretEl.offsetWidth; caretEl.classList.add("blink");
  },

  scrollIntoView(pos) {
    const r = this.rangeAt(pos, Math.min(pos + 1, this.text.length));
    const rect = r.getBoundingClientRect();
    if (!rect.height && !rect.top) return;
    const y = rect.top - scroll.getBoundingClientRect().top + scroll.scrollTop;
    scroll.scrollTo({ top: Math.max(0, y - scroll.clientHeight / 2), behavior: "smooth" });
  }
};

/* ============================================================
   EDITOR — controller around the surface
   ============================================================ */
const Editor = {
  cache: { pos: [], spell: [], style: { marks: [], issues: [], stats: {} }, textAt: null },
  find: { q: "", matches: [], idx: 0, open: false },
  pendingPaste: null,
  lastPaste: null,

  open(id) {
    if (state.activeId && state.bodies[state.activeId]) saveDoc(state.activeId);
    state.activeId = id;
    Docs.load(id).then(b => {
      Ed.text = b.text;
      Ed.pendingCaret = 0;
      History.reset();
      this.afterChange(true);
      UI.renderTree(); UI.syncTitle();
      scroll.scrollTop = 0;
      if (state.mode === "preview") Preview.render();
      saveIndex();
    });
  },

  /* diff the model against the stored body so authorship survives every edit */
  syncModel() {
    const b = state.bodies[state.activeId]; if (!b) return;
    const old = b.text, next = Ed.text;
    if (old === next) return;
    let p = 0; const min = Math.min(old.length, next.length);
    while (p < min && old[p] === next[p]) p++;
    let s = 0;
    while (s < min - p && old[old.length - 1 - s] === next[next.length - 1 - s]) s++;
    const removed = old.length - p - s, inserted = next.length - p - s;
    const kind = this.pendingPaste || 0;
    b.origins.splice(p, Math.max(0, removed), ...new Array(Math.max(0, inserted)).fill(kind));
    b.text = next;
    if (this.pendingPaste !== null && inserted > 0) {
      this.lastPaste = { s: p, e: p + inserted };
      if (inserted > 180) UI.offerAIMark(inserted);
    }
    this.pendingPaste = null;
  },

  afterChange(immediate) {
    this.syncModel();
    const heavy = state.settings.pos || state.settings.style || (state.settings.spellcheck && window.TypeDict);
    if (heavy) immediate ? this.analyze() : this.analyzeSoon();
    this.render();
    UI.stats(); UI.ribbon();
    if (state.activeId) { setSaved(false); autosave(state.activeId); }
    if (state.mode === "preview") Preview.renderSoon();
  },

  analyze() {
    const text = Ed.text, big = text.length > 60000;
    this.cache.pos = (state.settings.pos && !big) ? posMarks(text) : [];
    this.cache.spell = (state.settings.spellcheck && !big) ? spellMarks(text) : [];
    this.cache.style = (state.settings.style && !big) ? styleMarks(text) : { marks: [], issues: [], stats: {} };
    this.cache.textAt = text;
    UI.styleList();
    this.render();
  },
  analyzeSoon: null,

  focusRange() {
    const s = state.settings;
    if (!s.focusOn) return null;
    const t = Ed.text, c = Ed.sel().start;
    if (s.focus === "line") {
      const a = t.lastIndexOf("\n", c - 1) + 1;
      let b = t.indexOf("\n", c); if (b < 0) b = t.length;
      return [a, b];
    }
    if (s.focus === "paragraph") {
      let a = t.lastIndexOf("\n\n", Math.max(0, c - 1)); a = a < 0 ? 0 : a + 2;
      let b = t.indexOf("\n\n", c); if (b < 0) b = t.length;
      return [a, b];
    }
    let a = 0;
    const re = /[.!?…]["'’”)]?\s+|\n/g; let m;
    while ((m = re.exec(t)) && m.index < c) a = m.index + m[0].length;
    re.lastIndex = c;
    let b = t.length; const n = re.exec(t);
    if (n) b = n.index + (n[0].startsWith("\n") ? 0 : n[0].trimEnd().length);
    return [a, Math.max(a, b)];
  },

  render() {
    const text = Ed.text, marks = [];
    if (state.settings.markdown !== false) marks.push(...mdMarks(text));
    if (state.settings.pos && this.cache.textAt === text) marks.push(...this.cache.pos);
    if (state.settings.spellcheck && this.cache.textAt === text) marks.push(...this.cache.spell);
    if (state.settings.style && this.cache.textAt === text) marks.push(...this.cache.style.marks);
    if (state.settings.authorship) {
      const o = state.bodies[state.activeId]?.origins;
      if (o && o.length === text.length) {
        let i = 0;
        while (i < o.length) {
          let j = i; while (j < o.length && o[j] === o[i]) j++;
          if (o[i] === 1) marks.push({ s: i, e: j, cls: "auth-paste" });
          else if (o[i] === 2) marks.push({ s: i, e: j, cls: "auth-ai" });
          i = j;
        }
      }
    }
    if (this.find.open && this.find.matches.length) {
      this.find.matches.forEach((m, i) =>
        marks.push({ s: m[0], e: m[1], cls: i === this.find.idx ? "match current" : "match" }));
    }
    const fr = this.focusRange();
    if (fr) {
      if (fr[0] > 0) marks.push({ s: 0, e: fr[0], cls: "dim" });
      if (fr[1] < text.length) marks.push({ s: fr[1], e: text.length, cls: "dim" });
    }
    Ed.render(marks);
  },

  /* --------- find & replace --------- */
  runFind(q) {
    this.find.q = q; this.find.matches = [];
    if (q) {
      const t = Ed.text.toLowerCase(), n = q.toLowerCase();
      let i = t.indexOf(n);
      while (i !== -1 && this.find.matches.length < 2000) {
        this.find.matches.push([i, i + q.length]);
        i = t.indexOf(n, i + Math.max(1, q.length));
      }
    }
    this.find.idx = 0;
    $("#findCount").textContent = `${this.find.matches.length ? 1 : 0} / ${this.find.matches.length}`;
    this.render(); this.revealMatch();
  },
  step(d) {
    if (!this.find.matches.length) return;
    this.find.idx = (this.find.idx + d + this.find.matches.length) % this.find.matches.length;
    $("#findCount").textContent = `${this.find.idx + 1} / ${this.find.matches.length}`;
    this.render(); this.revealMatch();
  },
  revealMatch() {
    const m = this.find.matches[this.find.idx];
    if (m) Ed.scrollIntoView(m[0]);
  },
  replaceCurrent(rep) {
    const m = this.find.matches[this.find.idx]; if (!m) return;
    Ed.splice(m[0], m[1], rep);
    this.runFind(this.find.q);
  },
  replaceAll(rep) {
    if (!this.find.q) return;
    Ed.splice(0, Ed.text.length, Ed.text.split(this.find.q).join(rep), 0);
    this.runFind(this.find.q);
    UI.toast("Replaced every match");
  },
  scrollTo(pos) { Ed.scrollIntoView(pos); },

  wrapSelection(before, after = before) {
    const { start, end } = Ed.sel(), sel = Ed.text.slice(start, end);
    Ed.splice(start, end, before + sel + after, null);
    Ed.setSel(start + before.length, start + before.length + sel.length);
  }
};
Editor.analyzeSoon = debounce(() => Editor.analyze(), 160);

/* paint text with a set of overlapping ranges */
function paint(text, marks) {
  if (!text) return "";
  if (!marks.length) return esc(text);
  const bounds = new Set([0, text.length]);
  for (const m of marks) { bounds.add(clamp(m.s, 0, text.length)); bounds.add(clamp(m.e, 0, text.length)); }
  const pts = [...bounds].sort((a, b) => a - b);
  let out = "";
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1]; if (a === b) continue;
    const cls = marks.filter(m => m.s <= a && m.e >= b).map(m => m.cls).join(" ");
    const chunk = esc(text.slice(a, b));
    out += cls ? `<span class="${cls}">${chunk}</span>` : chunk;
  }
  return out;
}

/* ============================================================
   ANALYSIS — parts of speech, style, readability. All local.
   ============================================================ */
const Lex = {
  pron: new Set("i me my mine myself you your yours yourself he him his she her hers it its itself we us our ours ourselves they them their theirs themselves this that these those who whom whose which what anyone someone everyone nobody everybody somebody himself herself nothing something everything".split(" ")),
  prep: new Set("of in to for with on at from by about into like through over between out against during without before under around among across behind beyond within upon toward towards off near per via despite onto beside besides except inside outside throughout beneath above below along past down up".split(" ")),
  conj: new Set("and or but nor so yet because although though while whereas unless if than whether once since until when where after as plus".split(" ")),
  det:  new Set("a an the some any each every no both all half either neither".split(" ")),
  verb: new Set("be is am are was were been being have has had do does did will would can could shall should may might must get got go goes going went gone make made take took taken say said see saw seen come came know knew known think thought want wanted use used find found give gave given tell told work worked call called try tried ask asked need needed feel felt seem seemed leave left put mean meant keep kept let begin began help helped talk talked turn turned start started show showed shown hear heard play played run ran move moved live lived believe believed bring brought happen happened write wrote written sit sat stand stood lose lost pay paid meet met include included continue continued set learn learned change changed lead led understand understood watch watched follow followed stop stopped create created speak spoke read spend spent grow grew open opened walk walked win won teach taught offer offered remember remembered consider considered appear appeared buy bought serve served send sent build built stay stayed fall fell cut reach reached remain remained".split(" ")),
  adj:  new Set("good new first last long great little own other old right big high different small large next early young important few public bad same able real best better sure free low late hard major clear recent strong possible whole easy simple similar likely current common full available short special heavy fine quiet calm true false main deep wide narrow warm cold soft loud dark light quick slow".split(" ")),
  adjSuffix: /(ous|ive|ful|less|able|ible|ical|ic|ish|ary|al|ent|ant)$/,
  nounSuffix: /(tion|sion|ness|ment|ity|ship|ance|ence|ism|ist|hood|dom|age|ure)$/,
  lyExceptions: new Set("only family reply apply supply early likely ugly holy silly july italy rely imply comply multiply belly rally ally july".split(" ")),
  stop: new Set("the a an and or but of to in for on at by with from as is are was were be been being it its this that these those i you he she we they them his her their our your my not no do does did have has had will would can could should may might must about into than then there here what which who whom when where why how all any both each few more most other some such only own same so too very just".split(" "))
};

function tagWord(w, prevWord) {
  const l = w.toLowerCase();
  if (Lex.pron.has(l)) return "pron";
  if (Lex.conj.has(l)) return "conj";
  if (Lex.prep.has(l)) return "prep";
  if (Lex.det.has(l)) return null;
  if (Lex.verb.has(l)) return "verb";
  if (Lex.adj.has(l)) return "adj";
  if (/ly$/.test(l) && l.length > 4 && !Lex.lyExceptions.has(l)) return "adv";
  if (Lex.nounSuffix.test(l)) return "noun";
  if (/(ing|ed)$/.test(l) && l.length > 4) return "verb";
  if (/(ize|ise|ify|ate)$/.test(l) && l.length > 5) return "verb";
  if (Lex.adjSuffix.test(l) && l.length > 4) return "adj";
  if (prevWord && Lex.det.has(prevWord.toLowerCase())) return "noun";
  return "noun";
}

/* code fences and inline code should not be tagged */
function codeRanges(text) {
  const out = [];
  const fence = /^```[\s\S]*?^```/gm; let m;
  while ((m = fence.exec(text))) out.push([m.index, m.index + m[0].length]);
  const inline = /`[^`\n]+`/g;
  while ((m = inline.exec(text))) out.push([m.index, m.index + m[0].length]);
  const link = /\]\([^)\s]+\)/g;
  while ((m = link.exec(text))) out.push([m.index, m.index + m[0].length]);
  return out;
}
const inRanges = (i, rs) => rs.some(r => i >= r[0] && i < r[1]);

function posMarks(text) {
  const skip = codeRanges(text), marks = [], parts = state.settings.posParts;
  const re = /[A-Za-z][A-Za-z'’-]*/g; let m, prev = null;
  while ((m = re.exec(text))) {
    if (inRanges(m.index, skip)) { prev = m[0]; continue; }
    const tag = tagWord(m[0], prev); prev = m[0];
    if (tag && parts[tag]) marks.push({ s: m.index, e: m.index + m[0].length, cls: "pos-" + tag });
  }
  return marks;
}

/* ---------- spelling ---------- */
function spellMarks(text) {
  const D = window.TypeDict;
  if (!D) return [];
  const skip = codeRanges(text);
  const url = /\b(?:https?:\/\/|www\.|mailto:)\S+/g; let u;
  while ((u = url.exec(text))) skip.push([u.index, u.index + u[0].length]);
  const marks = [];
  const re = /[A-Za-z\u00C0-\u024F][A-Za-z\u00C0-\u024F'\u2019-]*/g; let m;
  while ((m = re.exec(text))) {
    let w = m[0].replace(/^[-'\u2019]+|[-'\u2019]+$/g, "");
    if (w.length < 2) continue;
    if (inRanges(m.index, skip)) continue;
    if (/^[A-Z0-9]+$/.test(w) && w.length <= 6) continue;      // acronyms
    if (D.has(w)) continue;
    const off = m[0].indexOf(w);
    marks.push({ s: m.index + off, e: m.index + off + w.length, cls: "sp-error" });
  }
  return marks;
}

/* ---------- style rules ---------- */
const CLICHES = ["at the end of the day","think outside the box","low-hanging fruit","move the needle","circle back","touch base","paradigm shift","in this day and age","needle in a haystack","tip of the iceberg","when all is said and done","last but not least","few and far between","the fact of the matter","only time will tell","calm before the storm","leave no stone unturned","light at the end of the tunnel","perfect storm","reinvent the wheel","tried and true","water under the bridge","game changer","best of both worlds","ahead of the curve","take it to the next level","in the grand scheme of things","each and every","first and foremost","crystal clear"];
const WORDY = { "in order to":"to","due to the fact that":"because","at this point in time":"now","in the event that":"if","for the purpose of":"to","a large number of":"many","in spite of the fact that":"although","has the ability to":"can","is able to":"can","on a daily basis":"daily","in the near future":"soon","take into consideration":"consider","make a decision":"decide","conduct an investigation":"investigate","in the process of":"","with regard to":"about","in terms of":"","it is important to note that":"","a majority of":"most","at the present time":"now","in close proximity to":"near" };
const REDUNDANT = ["absolutely essential","advance planning","basic fundamentals","close proximity","completely eliminate","end result","exact same","final outcome","free gift","past history","personal opinion","revert back","unexpected surprise","added bonus","join together","new innovation","future plans","null and void","brief summary","end product","repeat again","totally destroyed"];
const FILLER = ["very","really","just","actually","basically","literally","quite","rather","somewhat","simply","totally","definitely","certainly","essentially","honestly","truly","virtually","sort of","kind of","a bit","pretty much"];

const SC_CLASS = {
  "Cliché": "sc-cliche", "Wordy": "sc-wordy", "Redundant": "sc-redundant", "Filler": "sc-filler",
  "Passive voice": "sc-passive", "Weak verb": "sc-weak", "Adverb": "sc-adverb",
  "Long sentence": "sc-long", "Repetition": "sc-repeat"
};

function styleMarks(text) {
  const marks = [], issues = [];
  const add = (s, e, kind, note) => {
    marks.push({ s, e, cls: SC_CLASS[kind] });
    issues.push({ s, e, kind, note, text: text.slice(s, e).replace(/\s+/g, " ").slice(0, 70) });
  };
  const scan = (re, kind, noteFn) => {
    let m; re.lastIndex = 0;
    while ((m = re.exec(text))) {
      const note = noteFn(m);
      if (note !== null) add(m.index, m.index + m[0].length, kind, note);
      if (!re.global) break;
    }
  };
  const wordRe = a => new RegExp("\\b(" + a.map(s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b", "gi");

  scan(wordRe(CLICHES), "Cliché", () => "Worn phrase — say it your own way.");
  scan(wordRe(Object.keys(WORDY)), "Wordy", m => {
    const r = WORDY[m[0].toLowerCase()];
    return r ? `Try “${r}”.` : "Cut it — the sentence works without it.";
  });
  scan(wordRe(REDUNDANT), "Redundant", () => "One of these words is doing the other's job.");
  scan(wordRe(FILLER), "Filler", () => "Delete and reread — it usually still holds.");
  scan(/\b(am|is|are|was|were|be|been|being)\s+(?:\w+ly\s+)?(\w+(?:ed|en))\b(?=(\s+by\b)?)/gi, "Passive voice", () => "Name who does the action.");
  scan(/\b(there (?:is|are|was|were)|it is (?:important|clear|obvious)|this is)\b/gi, "Weak verb", () => "Start with the real subject.");
  scan(/\b(\w{4,}ly)\s+(\w+(?:ed|s|ing)?)\b/gi, "Adverb", m =>
    Lex.lyExceptions.has(m[1].toLowerCase()) ? null : `A stronger verb can absorb “${m[1]}”.`);

  /* long sentences + repeated words + readability */
  let sentences = 0, words = 0, syll = 0;
  const sre = /[^.!?\n]+[.!?]*/g; let sm;
  while ((sm = sre.exec(text))) {
    const raw = sm[0]; if (!raw.trim()) continue;
    const ws = raw.match(/[A-Za-z'’]+/g) || [];
    if (!ws.length) continue;
    sentences++; words += ws.length; ws.forEach(w => syll += syllables(w));
    if (ws.length > 30) add(sm.index + (raw.length - raw.trimStart().length), sm.index + raw.trimEnd().length,
      "Long sentence", `${ws.length} words. Consider a full stop in the middle.`);
  }
  const seen = [];
  const wre = /[A-Za-z][A-Za-z'’-]{3,}/g; let wm, idx = 0;
  while ((wm = wre.exec(text))) {
    const w = wm[0].toLowerCase(); idx++;
    if (!Lex.stop.has(w)) {
      const prior = seen.find(x => x.w === w && idx - x.i <= 14);
      if (prior) add(wm.index, wm.index + wm[0].length, "Repetition", `“${wm[0]}” appeared ${idx - prior.i} words ago.`);
      seen.push({ w, i: idx });
      if (seen.length > 300) seen.shift();
    }
  }
  const flesch = sentences && words
    ? Math.round(206.835 - 1.015 * (words / sentences) - 84.6 * (syll / words)) : null;
  return {
    marks,
    issues: issues.sort((a, b) => a.s - b.s),
    stats: { flesch, sentences, words, avg: sentences ? Math.round(words / sentences) : 0 }
  };
}

function syllables(w) {
  w = w.toLowerCase().replace(/[^a-z]/g, "");
  if (w.length <= 3) return 1;
  w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, "").replace(/^y/, "");
  return (w.match(/[aeiouy]{1,2}/g) || ["x"]).length;
}

/* ============================================================
   MARKDOWN — small, dependency-free renderer
   ============================================================ */
const MD = (() => {
  function inline(s) {
    s = esc(s);
    const code = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => `\u0000${code.push(c) - 1}\u0000`);
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, (_, a, u, t) =>
      `<img src="${u}" alt="${a}"${t ? ` title="${t}"` : ""}>`);
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, (_, a, u, t) =>
      `<a href="${u}"${t ? ` title="${t}"` : ""} target="_blank" rel="noopener">${a}</a>`);
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    s = s.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|\W)__([^_]+)__(?=\W|$)/g, "$1<strong>$2</strong>");
    s = s.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    s = s.replace(/(^|\W)_([^_\n]+)_(?=\W|$)/g, "$1<em>$2</em>");
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    s = s.replace(/ {2,}$/gm, "<br>");
    s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${code[+i]}</code>`);
    return s;
  }

  function render(src) {
    const lines = src.replace(/\r\n?/g, "\n").split("\n");
    let out = "", i = 0;
    const listStack = [];
    const closeLists = to => { while (listStack.length > to) out += `</${listStack.pop().tag}>`; };

    while (i < lines.length) {
      const line = lines[i];

      if (/^```/.test(line)) {
        const lang = line.slice(3).trim(); const buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++; closeLists(0);
        out += `<pre><code${lang ? ` class="lang-${esc(lang)}"` : ""}>${esc(buf.join("\n"))}</code></pre>`;
        continue;
      }
      if (/^\s*$/.test(line)) { closeLists(0); i++; continue; }
      if (/^ {0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { closeLists(0); out += "<hr>"; i++; continue; }

      const h = line.match(/^ {0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
      if (h) { closeLists(0); out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }

      if (/^ {0,3}>/.test(line)) {
        const buf = [];
        while (i < lines.length && /^ {0,3}>/.test(lines[i])) buf.push(lines[i++].replace(/^ {0,3}>\s?/, ""));
        closeLists(0); out += `<blockquote>${render(buf.join("\n"))}</blockquote>`; continue;
      }

      // table
      if (/\|/.test(line) && /^\s*\|?[\s:-]*-[\s|:-]*\|?\s*$/.test(lines[i + 1] || "")) {
        const cells = r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
        const head = cells(line); i += 2;
        let t = `<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>`;
        while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim()) {
          t += `<tr>${cells(lines[i++]).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`;
        }
        closeLists(0); out += t + "</tbody></table>"; continue;
      }

      const li = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
      if (li) {
        const depth = Math.floor(li[1].replace(/\t/g, "  ").length / 2);
        const tag = /\d/.test(li[2]) ? "ol" : "ul";
        while (listStack.length > depth + 1) closeLists(listStack.length - 1);
        if (listStack.length === depth + 1 && listStack[depth].tag !== tag) { closeLists(depth); }
        if (listStack.length < depth + 1) { out += `<${tag}>`; listStack.push({ tag }); }
        let body = li[3], cls = "";
        const task = body.match(/^\[([ xX])\]\s+(.*)$/);
        if (task) { cls = ' class="task"'; body = `<input type="checkbox" disabled${/[xX]/.test(task[1]) ? " checked" : ""}>${inline(task[2])}`; }
        else body = inline(body);
        out += `<li${cls}>${body}</li>`; i++; continue;
      }

      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^(```|\s*>|\s*#{1,6}\s|\s*([-*+]|\d+[.)])\s)/.test(lines[i])) buf.push(lines[i++]);
      closeLists(0);
      out += `<p>${inline(buf.join("\n"))}</p>`;
    }
    closeLists(0);
    return out;
  }
  return { render, inline };
})();

const Preview = {
  render() { previewEl.innerHTML = MD.render(Ed.text); },
  renderSoon: null
};
Preview.renderSoon = debounce(() => Preview.render(), 120);

/* ============================================================
   EXPORT — Markdown · HTML · PDF · DOCX (all built locally)
   ============================================================ */
const Export = (() => {
  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  const safe = n => (n || "Untitled").replace(/[\\/:*?"<>|]/g, "-").slice(0, 60);

  function htmlDoc(title, body) {
    return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title)}</title>
<style>
body{max-width:42em;margin:6vh auto;padding:0 6vw;font:19px/1.72 Georgia,"Times New Roman",serif;color:#16191B;background:#FBFBF9}
h1,h2,h3,h4{line-height:1.25;font-weight:600;margin:1.8em 0 .5em}h1{font-size:1.9em}
blockquote{margin:1.4em 0;padding-left:1em;border-left:2px solid #2F5D8C;color:#555;font-style:italic}
code{font:.85em ui-monospace,Menlo,monospace;background:#EFEFEA;padding:.1em .35em;border-radius:4px}
pre{background:#EFEFEA;padding:14px 16px;border-radius:8px;overflow-x:auto}pre code{background:none;padding:0}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #DDD;padding:6px 10px;text-align:left}
img{max-width:100%}hr{border:0;border-top:1px solid #DDD;margin:2.4em 0}a{color:#2F5D8C}
li.task{list-style:none;margin-left:-1.2em}
</style></head><body>${body}</body></html>`;
  }

  /* ---- minimal ZIP writer (stored entries) so DOCX needs no library ---- */
  const crcTable = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  const crc32 = buf => { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = crcTable[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const enc = new TextEncoder();

  function zip(files) {
    const chunks = [], central = []; let offset = 0;
    const u16 = n => [n & 255, (n >> 8) & 255];
    const u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
    for (const f of files) {
      const name = enc.encode(f.name), data = enc.encode(f.data), c = crc32(data);
      const local = [...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
        ...u32(c), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0)];
      chunks.push(new Uint8Array(local), name, data);
      central.push([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
        ...u32(c), ...u32(data.length), ...u32(data.length), ...u16(name.length),
        ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)], name);
      offset += local.length + name.length + data.length;
    }
    const cd = []; let cdSize = 0;
    for (let i = 0; i < central.length; i += 2) {
      const head = new Uint8Array(central[i]), nm = central[i + 1];
      cd.push(head, nm); cdSize += head.length + nm.length;
    }
    const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0),
      ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(offset), ...u16(0)]);
    return new Blob([...chunks, ...cd, end], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
  }

  const xe = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  function runsFrom(node, fmt = {}) {
    let out = "";
    node.childNodes.forEach(n => {
      if (n.nodeType === 3) {
        const t = n.nodeValue; if (!t) return;
        const props = [];
        if (fmt.b) props.push("<w:b/>"); if (fmt.i) props.push("<w:i/>");
        if (fmt.s) props.push("<w:strike/>");
        if (fmt.c) props.push('<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/>');
        out += `<w:r>${props.length ? `<w:rPr>${props.join("")}</w:rPr>` : ""}<w:t xml:space="preserve">${xe(t)}</w:t></w:r>`;
      } else if (n.nodeType === 1) {
        const tag = n.tagName.toLowerCase();
        const f = { ...fmt };
        if (tag === "strong" || tag === "b") f.b = true;
        if (tag === "em" || tag === "i") f.i = true;
        if (tag === "del") f.s = true;
        if (tag === "code") f.c = true;
        if (tag === "br") { out += "<w:r><w:br/></w:r>"; return; }
        out += runsFrom(n, f);
      }
    });
    return out;
  }

  function docxBody(html) {
    const doc = new DOMParser().parseFromString("<div>" + html + "</div>", "text/html");
    const root = doc.body.firstChild;
    let xml = "";
    const para = (style, runs) =>
      `<w:p>${style ? `<w:pPr><w:pStyle w:val="${style}"/></w:pPr>` : ""}${runs}</w:p>`;
    const walk = el => {
      el.childNodes.forEach(n => {
        if (n.nodeType !== 1) return;
        const tag = n.tagName.toLowerCase();
        if (/^h[1-6]$/.test(tag)) xml += para("Heading" + tag[1], runsFrom(n));
        else if (tag === "p") xml += para(null, runsFrom(n));
        else if (tag === "blockquote") { n.querySelectorAll("p").forEach(p => xml += para("Quote", runsFrom(p))); }
        else if (tag === "pre") xml += para("CodeBlock", `<w:r><w:rPr><w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/></w:rPr>${
          n.textContent.split("\n").map((l, i) => (i ? "<w:br/>" : "") + `<w:t xml:space="preserve">${xe(l)}</w:t>`).join("")}</w:r>`);
        else if (tag === "ul" || tag === "ol") {
          [...n.children].forEach((li, i) => {
            const bullet = tag === "ol" ? `${i + 1}.  ` : "•  ";
            xml += para("ListParagraph", `<w:r><w:t xml:space="preserve">${bullet}</w:t></w:r>` + runsFrom(li));
          });
        }
        else if (tag === "hr") xml += `<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:color="CCCCCC"/></w:pBdr></w:pPr></w:p>`;
        else if (tag === "table") {
          [...n.querySelectorAll("tr")].forEach(tr => {
            [...tr.children].forEach(td => xml += para(null, runsFrom(td)));
          });
        } else walk(n);
      });
    };
    walk(root);
    return xml;
  }

  const STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/><w:sz w:val="24"/></w:rPr></w:rPrDefault></w:docDefaults>
${[1,2,3,4,5,6].map(i => `<w:style w:type="paragraph" w:styleId="Heading${i}"><w:name w:val="heading ${i}"/><w:pPr><w:spacing w:before="${360 - i*30}" w:after="120"/><w:outlineLvl w:val="${i-1}"/></w:pPr><w:rPr><w:b/><w:sz w:val="${44 - i*4}"/></w:rPr></w:style>`).join("")}
<w:style w:type="paragraph" w:styleId="Quote"><w:name w:val="Quote"/><w:pPr><w:ind w:left="480"/></w:pPr><w:rPr><w:i/><w:color w:val="555555"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="CodeBlock"><w:name w:val="Code Block"/><w:pPr><w:shd w:val="clear" w:fill="F0F0EC"/><w:ind w:left="240"/></w:pPr><w:rPr><w:sz w:val="20"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="ListParagraph"><w:name w:val="List Paragraph"/><w:pPr><w:ind w:left="480"/><w:spacing w:after="60"/></w:pPr></w:style>
</w:styles>`;

  function docx(title, html) {
    const document_xml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${docxBody(html)}
<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1700" w:bottom="1440" w:left="1700"/></w:sectPr></w:body></w:document>`;
    return zip([
      { name: "[Content_Types].xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>` },
      { name: "_rels/.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>` },
      { name: "word/_rels/document.xml.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
      { name: "word/styles.xml", data: STYLES },
      { name: "word/document.xml", data: document_xml }
    ]);
  }

  return {
    run(kind) {
      const title = Docs.title(state.activeId) || "Untitled";
      const src = Ed.text, html = MD.render(src);
      if (kind === "md") download(new Blob([src], { type: "text/markdown" }), safe(title) + ".md");
      if (kind === "txt") download(new Blob([src], { type: "text/plain" }), safe(title) + ".txt");
      if (kind === "html") download(new Blob([htmlDoc(title, html)], { type: "text/html" }), safe(title) + ".html");
      if (kind === "docx") download(docx(title, html), safe(title) + ".docx");
      if (kind === "pdf") {
        const page = htmlDoc(title, html);
        const w = window.open("", "_blank");
        if (w) {
          w.document.write(page); w.document.close();
          w.onload = () => { w.focus(); w.print(); };
          return;
        }
        try {
          const f = document.createElement("iframe");
          f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
          document.body.appendChild(f);
          f.contentDocument.write(page); f.contentDocument.close();
          setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 1000); }, 250);
        } catch {
          UI.toast("Printing is blocked here — export HTML and print that", { label: "Export HTML", fn: () => Export.run("html") });
        }
        return;
      }
      UI.toast("Exported " + kind.toUpperCase());
    },
    download, safe
  };
})();

/* ============================================================
   UI
   ============================================================ */
function setSaved(ok) {
  const el = $("#stat-saved");
  el.textContent = ok ? (Store.persistent ? "Saved" : "Saved in this session") : "Saving…";
}

const UI = {
  /* ---------- chrome that stays out of the way ---------- */
  chromeTimer: null,
  showChrome(ms = 2600) {
    topbar.classList.add("show"); statusEl.classList.add("show");
    clearTimeout(this.chromeTimer);
    this.chromeTimer = setTimeout(() => {
      if (topbar.matches(":hover") || statusEl.matches(":hover") || $("#ctx").classList.contains("open")) return this.showChrome(ms);
      if (state.mode === "write") {
        topbar.classList.remove("show"); statusEl.classList.remove("show");
      }
    }, ms);
  },
  hideChrome() { topbar.classList.remove("show"); statusEl.classList.remove("show"); clearTimeout(this.chromeTimer); },

  toast(msg, action) {
    const t = $("#toast");
    t.innerHTML = `<span>${esc(msg)}</span>`;
    if (action) {
      const b = document.createElement("button");
      b.className = "mini"; b.textContent = action.label;
      b.onclick = () => { action.fn(); t.classList.remove("show"); };
      t.appendChild(b);
    }
    t.classList.add("show");
    clearTimeout(this._toast);
    this._toast = setTimeout(() => t.classList.remove("show"), action ? 7000 : 2400);
  },

  offerAIMark(n) {
    const range = Editor.lastPaste;
    this.toast(`Pasted ${countWords(Ed.text.slice(range.s, range.e))} words — pasted text.`, {
      label: "Mark as AI", fn: () => {
        const b = state.bodies[state.activeId];
        for (let i = range.s; i < range.e && i < b.origins.length; i++) b.origins[i] = 2;
        Editor.render(); UI.ribbon(); saveDoc(state.activeId);
      }
    });
  },

  /* ---------- small modal prompt (no browser dialogs) ---------- */
  prompt(label, value = "", { confirmLabel = "Save", danger = false } = {}) {
    return new Promise(res => {
      const p = document.createElement("div");
      p.className = "panel open";
      p.style.cssText = "top:22vh;left:50%;transform:translateX(-50%);width:min(400px,92vw);padding:16px;z-index:90";
      p.innerHTML = `<h3 style="margin-bottom:10px">${esc(label)}</h3>
        <input style="width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:7px;padding:8px 10px;font-size:14px" value="${esc(value)}">
        <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:12px">
          <button class="mini" data-x>Cancel</button><button class="mini" data-ok style="${danger ? "color:#C4453F" : "color:var(--accent)"}">${esc(confirmLabel)}</button>
        </div>`;
      let inp = p.querySelector("input");
      if (value === null) { inp.remove(); inp = null; }
      $("#main").appendChild(p); veil.classList.add("on");
      inp && (inp.focus(), inp.select());
      const done = v => { p.remove(); veil.classList.remove("on"); res(v); Ed.el.focus(); };
      p.querySelector("[data-x]").onclick = () => done(null);
      p.querySelector("[data-ok]").onclick = () => done(inp ? inp.value : true);
      p.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); done(inp ? inp.value : true); }
        if (e.key === "Escape") done(null);
      });
      veil.onclick = () => done(null);
    });
  },
  confirm(label, confirmLabel = "Delete") { return this.prompt(label, null, { confirmLabel, danger: true }); },

  /* ---------- sidebar tree ---------- */
  renderTree() {
    const q = $("#sideSearch").value.trim().toLowerCase();
    const tree = $("#tree"); tree.innerHTML = "";

    const docRow = m => {
      const r = document.createElement("div");
      r.className = "row" + (m.id === state.activeId ? " active" : "");
      r.draggable = true; r.dataset.doc = m.id; r.tabIndex = 0;
      r.innerHTML = `<svg class="glyph" viewBox="0 0 24 24">${m.pinned
        ? '<path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z"/>'
        : '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'}</svg>
        <span class="name">${esc(m.title || "Untitled")}</span>
        ${m.fav ? '<svg class="glyph" viewBox="0 0 24 24" style="opacity:.9;color:var(--flag)"><path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 9.7l5.4-.8z"/></svg>' : ""}
        <button class="more" aria-label="Document options"><svg class="glyph" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>`;
      r.onclick = e => { if (e.target.closest(".more")) return; Editor.open(m.id); if (innerWidth < 820) app.classList.remove("sidebar-open"); };
      r.querySelector(".more").onclick = e => { e.stopPropagation(); UI.docMenu(m.id, e); };
      r.oncontextmenu = e => { e.preventDefault(); UI.docMenu(m.id, e); };
      r.ondragstart = e => { e.dataTransfer.setData("text/plain", m.id); r.classList.add("dragging"); };
      r.ondragend = () => r.classList.remove("dragging");
      r.onkeydown = e => { if (e.key === "Enter") Editor.open(m.id); };
      return r;
    };

    if (q) {
      const hits = Docs.list().filter(m => {
        const body = state.bodies[m.id]?.text || "";
        return m.title.toLowerCase().includes(q) || body.toLowerCase().includes(q) ||
               m.tags.some(t => ("#" + t).toLowerCase().includes(q));
      });
      tree.innerHTML = `<div class="group-label">${hits.length} result${hits.length === 1 ? "" : "s"}</div>`;
      hits.forEach(m => tree.appendChild(docRow(m)));
      if (!hits.length) tree.insertAdjacentHTML("beforeend", `<p class="empty-note">Nothing matches “${esc(q)}”. Try a word from inside a document.</p>`);
      return;
    }

    const label = t => { const d = document.createElement("div"); d.className = "group-label"; d.textContent = t; return d; };

    const pinned = Docs.list().filter(m => m.pinned);
    if (pinned.length) { tree.appendChild(label("Pinned")); pinned.forEach(m => tree.appendChild(docRow(m))); }
    const favs = Docs.list().filter(m => m.fav && !m.pinned);
    if (favs.length) { tree.appendChild(label("Favorites")); favs.forEach(m => tree.appendChild(docRow(m))); }

    const tags = {};
    Docs.list().forEach(m => m.tags.forEach(t => (tags[t] = (tags[t] || 0) + 1)));
    if (Object.keys(tags).length) {
      tree.appendChild(label("Tags"));
      const wrap = document.createElement("div");
      wrap.style.cssText = "display:flex;flex-wrap:wrap;gap:5px;padding:2px 8px 4px";
      Object.entries(tags).sort().forEach(([t, n]) => {
        const b = document.createElement("button");
        b.className = "pill"; b.textContent = `#${t} ${n}`;
        b.onclick = () => { $("#sideSearch").value = "#" + t; UI.renderTree(); };
        wrap.appendChild(b);
      });
      tree.appendChild(wrap);
    }

    tree.appendChild(label("Documents"));
    const folderRow = f => {
      const r = document.createElement("div");
      r.className = "row"; r.dataset.folder = f.id; r.tabIndex = 0;
      r.innerHTML = `<svg class="glyph" viewBox="0 0 24 24" style="transform:rotate(${f.open ? 90 : 0}deg);transition:transform .2s"><path d="M9 6l6 6-6 6"/></svg>
        <svg class="glyph" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="name">${esc(f.name)}</span>
        <button class="more" aria-label="Folder options"><svg class="glyph" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>`;
      r.onclick = e => { if (e.target.closest(".more")) return; f.open = !f.open; saveIndex(); UI.renderTree(); };
      r.querySelector(".more").onclick = e => { e.stopPropagation(); UI.folderMenu(f.id, e); };
      r.oncontextmenu = e => { e.preventDefault(); UI.folderMenu(f.id, e); };
      r.ondragover = e => { e.preventDefault(); r.classList.add("drop"); };
      r.ondragleave = () => r.classList.remove("drop");
      r.ondrop = e => {
        e.preventDefault(); r.classList.remove("drop");
        const id = e.dataTransfer.getData("text/plain");
        if (state.metas[id]) { state.metas[id].folder = f.id; f.open = true; saveIndex(); UI.renderTree(); }
      };
      return r;
    };
    const branch = (parent, host) => {
      Docs.folderChildren(parent).forEach(f => {
        host.appendChild(folderRow(f));
        if (f.open) {
          const kids = document.createElement("div"); kids.className = "children";
          branch(f.id, kids);
          Docs.byFolder(f.id).forEach(m => kids.appendChild(docRow(m)));
          if (!kids.children.length) kids.innerHTML = '<p class="empty-note">Empty. Drag a document here.</p>';
          host.appendChild(kids);
        }
      });
    };
    branch(null, tree);
    Docs.byFolder(null).forEach(m => tree.appendChild(docRow(m)));
    tree.ondragover = e => e.preventDefault();
    tree.ondrop = e => {
      if (e.target.closest("[data-folder]")) return;
      const id = e.dataTransfer.getData("text/plain");
      if (state.metas[id]) { state.metas[id].folder = null; saveIndex(); UI.renderTree(); }
    };
  },

  menu(items, e) {
    const m = $("#ctx"); m.innerHTML = "";
    items.forEach(it => {
      if (it === "-") return m.insertAdjacentHTML("beforeend", "<hr>");
      const b = document.createElement("button");
      b.textContent = it.label; if (it.danger) b.className = "danger";
      b.onclick = () => { m.classList.remove("open"); it.fn(); };
      m.appendChild(b);
    });
    const r = $("#main").getBoundingClientRect();
    m.style.left = Math.min(e.clientX - r.left, r.width - 190) + "px";
    m.style.top = (e.clientY - r.top) + "px";
    m.classList.add("open");
    setTimeout(() => document.addEventListener("pointerdown", function h() {
      m.classList.remove("open"); document.removeEventListener("pointerdown", h);
    }), 0);
  },

  docMenu(id, e) {
    const m = state.metas[id];
    this.menu([
      { label: "Rename", fn: async () => {
        const v = await this.prompt("Rename document", m.title);
        if (v) { m.title = v; m.customTitle = true; const b = state.bodies[id]; if (b && !b.text.trim()) { b.text = "# " + v + "\n\n"; b.origins = new Array(b.text.length).fill(0); if (id === state.activeId) { Ed.text = b.text; Editor.afterChange(true); } } saveDoc(id); UI.renderTree(); UI.syncTitle(); }
      } },
      { label: "Duplicate", fn: () => { const nid = Docs.duplicate(id); UI.renderTree(); Editor.open(nid); } },
      { label: m.fav ? "Remove from favorites" : "Add to favorites", fn: () => { m.fav = !m.fav; saveIndex(); UI.renderTree(); } },
      { label: m.pinned ? "Unpin" : "Pin to top", fn: () => { m.pinned = !m.pinned; saveIndex(); UI.renderTree(); } },
      { label: "Edit tags", fn: async () => {
        const v = await this.prompt("Tags, separated by commas", m.tags.join(", "));
        if (v !== null) { m.tags = v.split(",").map(s => s.trim().replace(/^#/, "")).filter(Boolean); saveIndex(); UI.renderTree(); }
      } },
      "-",
      { label: "Export Markdown", fn: () => { Editor.open(id); setTimeout(() => Export.run("md"), 120); } },
      "-",
      { label: "Delete", danger: true, fn: async () => {
        if (await this.confirm(`Delete “${m.title}”? This cannot be undone.`)) {
          Docs.remove(id);
          if (state.activeId === id) {
            const next = Docs.list()[0]?.id || Docs.create({ title: "Untitled" });
            Editor.open(next);
          }
          UI.renderTree(); UI.toast("Deleted");
        }
      } }
    ], e);
  },

  folderMenu(id, e) {
    const f = state.folders[id];
    this.menu([
      { label: "New document here", fn: () => { const nid = Docs.create({ folder: id }); f.open = true; UI.renderTree(); Editor.open(nid); } },
      { label: "New nested folder", fn: async () => {
        const v = await this.prompt("Folder name", "Untitled folder");
        if (v) { const nid = uid(); state.folders[nid] = { id: nid, name: v, parent: id, open: true }; f.open = true; saveIndex(); UI.renderTree(); }
      } },
      { label: "Rename", fn: async () => { const v = await this.prompt("Rename folder", f.name); if (v) { f.name = v; saveIndex(); UI.renderTree(); } } },
      "-",
      { label: "Delete folder", danger: true, fn: async () => {
        if (await this.confirm(`Delete “${f.name}”? Documents inside move up one level.`)) {
          Object.values(state.metas).forEach(m => { if (m.folder === id) m.folder = f.parent || null; });
          Object.values(state.folders).forEach(x => { if (x.parent === id) x.parent = f.parent || null; });
          delete state.folders[id]; saveIndex(); UI.renderTree();
        }
      } }
    ], e);
  },

  syncTitle() { $("#docTitle").textContent = Docs.title(state.activeId) || "Untitled"; },

  stats() {
    const t = Ed.text, w = countWords(t);
    $("#stat-words").textContent = w + (w === 1 ? " word" : " words");
    $("#stat-chars").textContent = t.length.toLocaleString() + " characters";
    $("#stat-read").textContent = Math.max(1, Math.round(w / 220)) + " min read";
    const n = Editor.cache.style.issues?.length || 0;
    $("#stat-style").textContent = state.settings.style ? `style: ${n} flag${n === 1 ? "" : "s"}` : "style: off";
    this.syncTitle();
  },

  ribbon() {
    const on = state.settings.authorship && Ed.text.length > 40;
    ribbon.classList.toggle("on", on);
    if (!on) return;
    const o = state.bodies[state.activeId]?.origins || [];
    const c = [0, 0, 0];
    for (let i = 0; i < o.length; i++) c[o[i]]++;
    const total = o.length || 1;
    ribbon.querySelectorAll("i").forEach(n => n.remove());
    const names = ["typed", "paste", "ai"];
    for (let k = 0; k < 3; k++) {
      if (!c[k]) continue;
      const i = document.createElement("i");
      i.className = "seg-" + names[k];
      i.style.height = (c[k] / total * 100) + "%";
      ribbon.appendChild(i);
    }
    const pct = k => Math.round(c[k] / total * 100);
    $("#ribbonKey").innerHTML = `${pct(0)}% yours · ${pct(1)}% pasted · ${pct(2)}% AI`;
  },

  styleList() {
    const list = $("#styleList"), { issues, stats } = Editor.cache.style;
    list.innerHTML = "";
    $("#styleLegend").innerHTML = Object.entries(SC_CLASS)
      .map(([kind, cls]) => `<span><b style="color:var(--${cls})">▉</b>${esc(kind.toLowerCase())}</span>`).join("");
    if (!state.settings.style) {
      list.innerHTML = '<p class="empty-note">Style check is off. Turn it on to see clichés, passive voice, filler and long sentences flagged in place.</p>';
      $("#styleReadout").innerHTML = "";
      return;
    }
    if (!issues.length) {
      list.innerHTML = '<p class="empty-note">Nothing flagged. Keep going.</p>';
    } else {
      issues.slice(0, 400).forEach(is => {
        const b = document.createElement("button");
        b.className = "issue";
        b.innerHTML = `<span class="kind" style="color:var(--${SC_CLASS[is.kind]})">${esc(is.kind)}</span><b>${esc(is.text)}</b> — ${esc(is.note)}`;
        b.onclick = () => { Ed.el.focus(); Ed.setSel(is.s, is.e); Editor.scrollTo(is.s); Editor.render(); };
        list.appendChild(b);
      });
    }
    const f = stats.flesch;
    const grade = f == null ? "—" : f >= 70 ? "Plain" : f >= 60 ? "Clear" : f >= 50 ? "Firm" : f >= 30 ? "Dense" : "Heavy";
    $("#styleReadout").innerHTML =
      `<div><b>${issues.length}</b>flags</div><div><b>${stats.avg || 0}</b>avg sentence</div><div><b>${grade}</b>reading ease${f != null ? ` (${f})` : ""}</div>`;
  },

  /* ---------- settings ---------- */
  applySettings() {
    const s = state.settings;
    const theme = s.theme === "auto"
      ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : s.theme;
    document.documentElement.dataset.theme = theme;
    const fonts = { serif: "var(--serif)", sans: "var(--ui)", mono: "var(--mono)" };
    const r = document.documentElement.style;
    r.setProperty("--font", fonts[s.font]);
    r.setProperty("--fs", s.fontSize + "px");
    r.setProperty("--lh", s.lineHeight);
    r.setProperty("--measure", s.measure + "ch");
    r.setProperty("--half", (s.measure / 2) + "ch");
    const native = s.spellcheck && !window.TypeDict;   // only if dictionary.js is missing
    ed.spellcheck = native; ed.lang = s.lang;
    ed.setAttribute("spellcheck", String(native));
    document.documentElement.dataset.caret = s.caretBlock ? "block" : "native";
    requestAnimationFrame(() => Ed.caret());
    $("#focusBtn").style.color = s.focusOn ? "var(--accent)" : "";
    $("#styleBtn").style.color = s.style ? "var(--accent)" : "";

  },

    body.innerHTML = `
      <div class="section-title">Appearance</div>
      ${row("Theme", "", sel("theme", [["light", "Light"], ["dark", "Dark"], ["auto", "Match system"]], s.theme))}
      ${row("Typeface", "", sel("font", [["mono", "IBM Plex Mono (duospace)"], ["serif", "Newsreader (serif)"], ["sans", "IBM Plex Sans"]], s.font))}
      ${row("Font size", "", rng("fontSize", 15, 28, 1, s.fontSize, "px"))}
      ${row("Line height", "", rng("lineHeight", 1.3, 2.4, .02, s.lineHeight))}
      ${row("Writing width", "Characters per line", rng("measure", 40, 110, 1, s.measure, "ch"))}
      ${row("Block caret", "A wide typewriter cursor instead of the thin system one", sw("caretBlock", s.caretBlock))}

      <div class="section-title">Focus</div>
      ${row("Focus mode", "Dim everything but what you are writing", sw("focusOn", s.focusOn))}
      ${row("Focus unit", "", sel("focus", [["sentence", "Sentence"], ["paragraph", "Paragraph"], ["line", "Line"]], s.focus))}

      <div class="section-title">Feedback</div>
      ${row("Live formatting", "Headings, bold and italics take shape as you type", sw("markdown", s.markdown))}
      ${row("Parts of speech", "Colour nouns, verbs, adjectives and the rest", sw("pos", s.pos))}
      <div class="set" style="flex-wrap:wrap;gap:6px" id="posParts">
        ${Object.entries({ noun: "Nouns", verb: "Verbs", adj: "Adjectives", adv: "Adverbs", conj: "Conjunctions", prep: "Prepositions", pron: "Pronouns" })
          .map(([k, l]) => `<button class="pill" data-part="${k}" style="${s.posParts[k] ? `background:var(--pos-${k});color:var(--paper)` : ""}">${l}</button>`).join("")}
      </div>
      ${row("Style check", "Clichés, passive voice, filler, long sentences", sw("style", s.style))}
      ${row("Authorship", "Tint pasted and AI text, and show the grain bar", sw("authorship", s.authorship))}

      <div class="section-title">Writing</div>
      ${row("Autosave", "Saves a moment after you stop typing", sw("autosave", s.autosave))}
      ${row("Spell check", window.TypeDict
        ? `Misspellings turn red. ${(130610).toLocaleString()} words, checked on this device.`
        : "Uses your browser's dictionary — dictionary.js is not loaded", sw("spellcheck", s.spellcheck))}
      ${row("Language", "", sel("lang", [["en", "English"], ["en-GB", "English (UK)"], ["es", "Español"], ["fr", "Français"], ["de", "Deutsch"], ["pt", "Português"], ["it", "Italiano"]], s.lang))}

      <div class="section-title">Keyboard</div>
      ${[["New document", "N"], ["Save now", "S"], ["Quick open / commands", "K"], ["Find", "F"], ["Find and replace", "⌥F"],
         ["Focus mode", "+F"], ["Preview", "+P"], ["Style check", "+S"], ["Export", "E"], ["Settings", ","],
         ["Toggle sidebar", "\\"], ["Bold", "B"], ["Italic", "I"], ["Undo", "Z"], ["Redo", "+Z"]]
        .map(([l, k]) => `<div class="keyrow"><span>${l}</span><kbd>${KEY}${k}</kbd></div>`).join("")}

      <div class="section-title">Privacy</div>
      <p class="empty-note" style="padding:6px 0">Every feature here runs on this device. Style analysis, part-of-speech colouring and authorship tracking never leave the page, and nothing is uploaded.</p>
      <p class="empty-note" style="padding:0 0 6px">Database: <b style="color:var(--ink);font-family:var(--mono)">${esc(Store.backend)}</b>. Spelling: <b style="color:var(--ink);font-family:var(--mono)">${window.TypeDict ? "dictionary.js, offline" : "browser"}</b>. ${Store.persistent ? "Documents save themselves there and reload when you come back." : "Nothing persists in this mode - keep db.js beside type.html, or export anything you want to keep."}</p>`;

    body.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => {
      const k = b.dataset.toggle;
      s[k] = !s[k]; b.setAttribute("aria-pressed", String(s[k]));
      this.applySettings();
      if (k === "pos" || k === "style" || k === "spellcheck") Editor.analyze();
      Editor.render(); this.stats(); this.ribbon();
      if (k === "style") $("#stylepanel").classList.toggle("open", s.style);
    });
    body.querySelectorAll("[data-set]").forEach(el => el.oninput = () => {
      const k = el.dataset.set;
      s[k] = el.type === "range" ? +el.value : el.value;
      const v = body.querySelector(`[data-val="${k}"]`);
      if (v) v.textContent = el.value + (k === "fontSize" ? "px" : k === "measure" ? "ch" : "");
      this.applySettings(); Editor.render();
    });
    body.querySelectorAll("[data-part]").forEach(b => b.onclick = () => {
      const k = b.dataset.part; s.posParts[k] = !s.posParts[k];
      b.style.cssText = s.posParts[k] ? `background:var(--pos-${k});color:var(--paper)` : "";
      saveSettings(); Editor.analyze();
    });
  },

  /* ---------- command palette ---------- */
  palette(open) {
    const p = $("#palette");
    p.classList.toggle("open", open); veil.classList.toggle("on", open);
    if (open) { $("#palInput").value = ""; this.palFill(""); $("#palInput").focus(); }
    else Ed.el.focus();
  },
  palFill(q) {
    const cmds = [
      { label: "New document", hint: KEY + "N", fn: () => { const id = Docs.create({}); UI.renderTree(); Editor.open(id); } },
      { label: "New folder", fn: async () => { const v = await UI.prompt("Folder name", "Untitled folder"); if (v) { const id = uid(); state.folders[id] = { id, name: v, parent: null, open: true }; saveIndex(); UI.renderTree(); } } },
      { label: "Toggle focus mode", hint: KEY + "+F", fn: () => Actions.toggle("focusOn") },
      { label: "Focus: sentence", fn: () => { state.settings.focus = "sentence"; state.settings.focusOn = true; UI.applySettings(); Editor.render(); UI.buildSettings(); } },
      { label: "Focus: paragraph", fn: () => { state.settings.focus = "paragraph"; state.settings.focusOn = true; UI.applySettings(); Editor.render(); UI.buildSettings(); } },
      { label: "Focus: line", fn: () => { state.settings.focus = "line"; state.settings.focusOn = true; UI.applySettings(); Editor.render(); UI.buildSettings(); } },
      { label: "Toggle preview", hint: KEY + "+P", fn: () => Actions.mode(state.mode === "write" ? "preview" : "write") },
      { label: "Toggle parts of speech", fn: () => Actions.toggle("pos") },
      { label: "Toggle style check", hint: KEY + "+S", fn: () => Actions.styleCheck() },
      { label: "Toggle authorship colours", fn: () => Actions.toggle("authorship") },
      { label: "Switch theme", fn: () => { state.settings.theme = state.settings.theme === "dark" ? "light" : "dark"; UI.applySettings(); UI.buildSettings(); } },
      { label: "Export Markdown", fn: () => Export.run("md") },
      { label: "Export HTML", fn: () => Export.run("html") },
      { label: "Export Word (.docx)", fn: () => Export.run("docx") },
      { label: "Export PDF", fn: () => Export.run("pdf") },
      { label: "Open settings", hint: KEY + ",", fn: () => Actions.settings(true) },
      { label: "Save now", hint: KEY + "S", fn: () => saveDoc(state.activeId) }
    ];
    const docs = Docs.list().sort((a, b) => b.updated - a.updated).map(m => ({
      label: m.title || "Untitled", hint: "document", fn: () => Editor.open(m.id)
    }));
    const all = [...docs, ...cmds].filter(x => x.label.toLowerCase().includes(q.toLowerCase())).slice(0, 40);
    const list = $("#palList"); list.innerHTML = "";
    all.forEach((x, i) => {
      const b = document.createElement("button");
      b.className = "pal-item" + (i === 0 ? " sel" : "");
      b.innerHTML = `<span>${esc(x.label)}</span><span class="hint">${esc(x.hint || "")}</span>`;
      b.onclick = () => { UI.palette(false); x.fn(); };
      list.appendChild(b);
    });
    if (!all.length) list.innerHTML = '<p class="empty-note">No match. Press Escape to go back.</p>';
  }
};

   ACTIONS + EVENTS
