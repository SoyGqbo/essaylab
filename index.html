const Actions = {
  toggle(key) {
    state.settings[key] = !state.settings[key];
    UI.applySettings(); UI.buildSettings();
    if (key === "pos" || key === "style") Editor.analyze();
    Editor.render(); UI.stats(); UI.ribbon();
    UI.toast(`${{ focusOn: "Focus mode", pos: "Parts of speech", style: "Style check", authorship: "Authorship" }[key]} ${state.settings[key] ? "on" : "off"}`);
  },
  styleCheck() {
    state.settings.style = !state.settings.style;
    $("#stylepanel").classList.toggle("open", state.settings.style);
    UI.applySettings(); UI.buildSettings(); Editor.analyze(); UI.stats();
  },
  mode(m) {
    state.mode = m;
    const write = m === "write";
    $("#canvas").classList.toggle("hidden", !write);
    previewEl.classList.toggle("hidden", write);
    $("#modeWrite").setAttribute("aria-pressed", String(write));
    $("#modePreview").setAttribute("aria-pressed", String(!write));
    ribbon.classList.toggle("hidden", !write);
    if (!write) { Preview.render(); UI.showChrome(3200); } else { Ed.el.focus(); UI.ribbon(); }
    Ed.caret();
  },
  settings(open) {
    $("#settings").classList.toggle("open", open);
    veil.classList.toggle("on", open);
    if (open) UI.buildSettings(); else Ed.el.focus();
  },
  find(withReplace) {
    Editor.find.open = true;
    $("#findbar").classList.add("open");
    $("#replaceLine").classList.toggle("hidden", !withReplace);
    const sel = Ed.text.slice(Ed.sel().start, Ed.sel().end);
    if (sel && sel.length < 80) $("#findInput").value = sel;
    $("#findInput").focus(); $("#findInput").select();
    Editor.runFind($("#findInput").value);
  },
  closeFind() {
    Editor.find.open = false; Editor.find.matches = [];
    $("#findbar").classList.remove("open"); Editor.render(); Ed.el.focus();
  },
  exportMenu(e) {
    UI.menu([
      { label: "Markdown (.md)", fn: () => Export.run("md") },
      { label: "Plain text (.txt)", fn: () => Export.run("txt") },
      { label: "HTML (.html)", fn: () => Export.run("html") },
      { label: "Word (.docx)", fn: () => Export.run("docx") },
      { label: "PDF (print)", fn: () => Export.run("pdf") }
    ], e);
  }
};

/* ---------- editor events ---------- */
ed.addEventListener("focus", () => Ed.caret());
ed.addEventListener("blur", () => Ed.caret());
window.addEventListener("resize", () => Ed.caret());
ed.addEventListener("compositionstart", () => { Ed.composing = true; });
ed.addEventListener("compositionend", () => {
  Ed.composing = false;
  Ed.text = Ed.domText();
  Editor.afterChange();
});
ed.addEventListener("input", () => {
  if (Ed.composing) return;
  History.snap();
  Ed.text = Ed.domText();
  Editor.afterChange();
});
ed.addEventListener("paste", e => {
  e.preventDefault();
  const data = (e.clipboardData || window.clipboardData);
  const txt = data ? data.getData("text/plain") : "";
  if (!txt) return;
  Editor.pendingPaste = 1;
  Ed.insert(txt);
});
ed.addEventListener("drop", e => {
  const txt = e.dataTransfer?.getData("text/plain");
  if (txt) { e.preventDefault(); Editor.pendingPaste = 1; Ed.insert(txt); }
});
document.addEventListener("selectionchange", () => {
  if (document.activeElement !== ed) return;
  Ed.caret();
  if (state.settings.focusOn && !Ed.composing) { Ed.sel(); Editor.renderFocusSoon(); }
  else if (Ed.text.length < 20000) Ed.sel();   // keep it cheap in very long documents
});
Editor.renderFocusSoon = (() => {
  let queued = false;
  return () => {
    if (queued) return; queued = true;
    requestAnimationFrame(() => { queued = false; Editor.render(); });
  };
})();

ed.addEventListener("keydown", e => {
  UI.hideChrome();
  if (mod(e) || e.altKey) return;

  if (e.key === "Tab") {
    e.preventDefault();
    const { start, end } = Ed.sel();
    if (e.shiftKey) {
      const lineStart = Ed.text.lastIndexOf("\n", start - 1) + 1;
      if (/^ {1,2}/.test(Ed.text.slice(lineStart))) {
        const cut = Ed.text.slice(lineStart).match(/^ {1,2}/)[0].length;
        Ed.splice(lineStart, lineStart + cut, "", start - cut);
      }
    } else Ed.splice(start, end, "  ");
    return;
  }

  if (e.key === "Enter" && !e.shiftKey) {
    const t = Ed.text, c = Ed.sel().start;
    const lineStart = t.lastIndexOf("\n", c - 1) + 1;
    const line = t.slice(lineStart, c);
    const m = line.match(/^(\s*)([-*+]|\d+[.)])(\s+)(\[[ xX]\]\s+)?/);
    if (!m) return;
    e.preventDefault();
    if (line.trim() === m[0].trim()) {            // empty item — end the list
      Ed.splice(lineStart, c, "");
      return;
    }
    const marker = /\d/.test(m[2]) ? m[1] + (parseInt(m[2], 10) + 1) + m[2].slice(-1) + " " : m[1] + m[2] + " ";
    Ed.splice(c, c, "\n" + marker + (m[4] ? "[ ] " : ""));
  }
});
function caretOffsetFromPoint(x, y) {
  let range = null;
  if (document.caretRangeFromPoint) range = document.caretRangeFromPoint(x, y);
  else if (document.caretPositionFromPoint) {
    const p = document.caretPositionFromPoint(x, y);
    if (p) { range = document.createRange(); range.setStart(p.offsetNode, p.offset); }
  }
  return range ? Ed.offsetOf(range.startContainer, range.startOffset) : -1;
}

ed.addEventListener("contextmenu", e => {
  if (!state.settings.spellcheck || !window.TypeDict) return;
  const pos = caretOffsetFromPoint(e.clientX, e.clientY);
  const hit = Editor.cache.spell.find(m => pos >= m.s && pos <= m.e);
  if (!hit) return;
  e.preventDefault();
  const word = Ed.text.slice(hit.s, hit.e);
  const items = TypeDict.suggest(word, 5).map(sug => ({
    label: sug, fn: () => Ed.splice(hit.s, hit.e, sug)
  }));
  if (!items.length) items.push({ label: "No suggestions", fn: () => {} });
  items.push("-", { label: `Add “${word}” to dictionary`, fn: () => learnWord(word) });
  UI.menu(items, e);
});

function learnWord(word) {
  TypeDict.add(word);
  state.learned = [...new Set([...(state.learned || []), word])];
  Store.set("type:dictionary", state.learned);
  Editor.analyze();
  UI.toast(`“${word}” added to your dictionary`);
}

scroll.addEventListener("scroll", () => { if (state.mode === "write") UI.hideChrome(); }, { passive: true });

/* ---------- global chrome + shortcuts ---------- */
document.addEventListener("mousemove", e => {
  if (e.clientY < 90 || e.clientY > innerHeight - 70) UI.showChrome();
});
document.addEventListener("keydown", e => {
  const palOpen = $("#palette").classList.contains("open");
  if (e.key === "Escape") {
    if (palOpen) return UI.palette(false);
    if ($("#settings").classList.contains("open")) return Actions.settings(false);
    if (Editor.find.open) return Actions.closeFind();
    if ($("#stylepanel").classList.contains("open")) return Actions.styleCheck();
    if (state.mode === "preview") return Actions.mode("write");
  }
  if (palOpen) {
    const items = $$("#palList .pal-item");
    const cur = items.findIndex(i => i.classList.contains("sel"));
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const n = clamp(cur + (e.key === "ArrowDown" ? 1 : -1), 0, items.length - 1);
      items.forEach(i => i.classList.remove("sel")); items[n]?.classList.add("sel");
      items[n]?.scrollIntoView({ block: "nearest" });
    }
    if (e.key === "Enter") { e.preventDefault(); items[Math.max(0, cur)]?.click(); }
    return;
  }
  if (!mod(e)) return;
  const k = e.key.toLowerCase();
  const hit = fn => { e.preventDefault(); fn(); };
  if (k === "n" && !e.shiftKey) return hit(() => { const id = Docs.create({}); UI.renderTree(); Editor.open(id); UI.toast("New document"); });
  if (k === "s" && e.shiftKey) return hit(() => Actions.styleCheck());
  if (k === "s") return hit(() => { saveDoc(state.activeId); UI.toast("Saved"); });
  if (k === "k") return hit(() => UI.palette(true));
  if (k === "f" && e.altKey) return hit(() => Actions.find(true));
  if (k === "f" && e.shiftKey) return hit(() => Actions.toggle("focusOn"));
  if (k === "f") return hit(() => Actions.find(false));
  if (k === "p" && e.shiftKey) return hit(() => Actions.mode(state.mode === "write" ? "preview" : "write"));
  if (k === "e") return hit(() => Actions.exportMenu({ clientX: innerWidth - 240, clientY: 60 }));
  if (k === ",") return hit(() => Actions.settings(true));
  if (k === "\\") return hit(() => app.classList.toggle("sidebar-open"));
  if (k === "b") return hit(() => Editor.wrapSelection("**"));
  if (k === "i") return hit(() => Editor.wrapSelection("*"));
  if (k === "z" && e.shiftKey) return hit(() => History.redo());
  if (k === "z") return hit(() => History.undo());
  if (k === "y") return hit(() => History.redo());
  if (k === "g") return hit(() => Editor.step(e.shiftKey ? -1 : 1));
});

$("#focusBtn").onclick = () => Actions.toggle("focusOn");
$("#styleBtn").onclick = () => Actions.styleCheck();
$("#exportBtn").onclick = e => Actions.exportMenu(e);
$("#settingsBtn").onclick = () => Actions.settings(true);
$("#settingsClose").onclick = () => Actions.settings(false);
$("#styleClose").onclick = () => Actions.styleCheck();
$("#stat-style").onclick = () => Actions.styleCheck();
$("#findInput").addEventListener("input", e => Editor.runFind(e.target.value));
$("#findInput").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); Editor.step(e.shiftKey ? -1 : 1); }
  if (e.key === "Escape") Actions.closeFind();
});
$("#findNext").onclick = () => Editor.step(1);
$("#findPrev").onclick = () => Editor.step(-1);
$("#findClose").onclick = () => Actions.closeFind();
$("#replaceOne").onclick = () => Editor.replaceCurrent($("#replaceInput").value);
$("#replaceAll").onclick = () => Editor.replaceAll($("#replaceInput").value);
$("#palInput").addEventListener("input", e => UI.palFill(e.target.value));
veil.addEventListener("click", () => {
  if ($("#palette").classList.contains("open")) UI.palette(false);
  if ($("#settings").classList.contains("open")) Actions.settings(false);
});
window.addEventListener("beforeunload", () => { if (state.activeId) saveDoc(state.activeId); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (state.settings.theme === "auto") UI.applySettings();
});

/* ============================================================
   BOOT
   ============================================================ */
const WELCOME = `# welcome to type.

A writing room with nothing in it but your words. The interface stays hidden until you move the mouse or reach for a key.

## Formatting happens as you write

Start a line with **#** and it becomes a heading. Wrap a word in **double asterisks** for bold, *single* for italics, ~~tildes~~ to strike it out. The markers stay in the text — they simply fade back so the shape of the document comes forward.

- Lists work like this
- Press Enter and the next bullet appears
- [ ] Square brackets make a task
- Press ${KEY}+P to see it fully rendered

## What the colours mean

Turn on *parts of speech* and every noun, verb, adjective and adverb takes its own hue. Hunting adverbs is the fastest way to find soft sentences.

Turn on *style check* and problems are tinted rather than underlined, the way a code editor tints a keyword: red for a cliché, violet for passive voice, amber for a weak adverb, grey for filler you can delete, teal for a wordy phrase, blue for a word you have just repeated. The panel lists every flag with a colour key. Nothing is ever rewritten for you.

> The bar to the left of the page is the grain of the document: how much you typed, how much arrived by paste, how much came from a model. Awareness, not judgement.

## Everything stays here

Your work saves itself into a local database that ships beside this app in db.js — no account, no upload, no telemetry. When you want the writing elsewhere, export it as Markdown, HTML, Word or PDF.

---

Delete this line and begin.
`;

(async function boot() {
  await Store.ready;
  const saved = await Store.get("type:settings");
  if (saved) {
    state.settings = { ...DEFAULTS, ...saved, posParts: { ...DEFAULTS.posParts, ...(saved.posParts || {}) } };
    if ((saved.v || 1) < 2) {          // the writing face moved to duospace
      Object.assign(state.settings, { v: 2, font: "mono", fontSize: 18, lineHeight: 1.8, caretBlock: true });
    }
  }
  UI.applySettings();

  const learned = await Store.get("type:dictionary");
  state.learned = learned || [];
  if (window.TypeDict) state.learned.forEach(w => TypeDict.add(w));

  const index = await Store.get("type:index");
  if (index && Object.keys(index.metas || {}).length) {
    state.folders = index.folders || {};
    state.metas = index.metas || {};
    await Promise.all(Object.keys(state.metas).map(id => Docs.load(id)));
    state.activeId = state.metas[index.activeId] ? index.activeId
      : Object.values(state.metas).sort((a, b) => b.updated - a.updated)[0].id;
  } else {
    const fid = uid();
    state.folders[fid] = { id: fid, name: "Drafts", parent: null, open: true };
    const id = Docs.create({ title: "welcome to type.", text: WELCOME });
    Docs.create({ title: "Untitled", folder: fid });
    state.activeId = id;
  }

  // plain-text editing where the browser supports it, plain "true" elsewhere
  try {
    ed.setAttribute("contenteditable", "plaintext-only");
    if (ed.contentEditable !== "plaintext-only") ed.setAttribute("contenteditable", "true");
  } catch { ed.setAttribute("contenteditable", "true"); }

  app.classList.add("sidebar-open");
  UI.renderTree();
  Editor.open(state.activeId);
  UI.buildSettings();
  UI.styleList();
  UI.showChrome(4200);
  setTimeout(() => Ed.el.focus(), 300);
})();
})();

</script>
