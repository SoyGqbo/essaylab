<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>type. — plain text, nothing else</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   type. — design tokens
   Light: cool paper, graphite ink. Dark: true black, neutral greys.
   Flags are coloured like a syntax theme, never underlined.
   ============================================================ */
:root{
  --paper:#EFF0EC; --paper-2:#E7E9E3; --panel:#E9EAE4; --rule:#D8DAD1;
  --ink:#16191B; --ink-soft:#5D6461; --ink-faint:#8B918C; --dim:#C2C6BE;
  --accent:#2F5D8C; --accent-soft:#2F5D8C22; --flag:#A9691F; --caret:#2E9BE0;
  --pos-noun:#2F5D8C; --pos-verb:#9C4A2F; --pos-adj:#5C7C3D;
  --pos-adv:#7E58A0; --pos-conj:#78736A; --pos-prep:#37837C; --pos-pron:#A03A54;
  --sc-cliche:#C0453B; --sc-passive:#7B4FB5; --sc-adverb:#B4711A; --sc-filler:#9AA0A6;
  --sc-wordy:#1F8079; --sc-redundant:#A83A72; --sc-weak:#5F7F30; --sc-repeat:#2F6FA0;
  --sc-long:rgba(169,105,31,.10); --sp-error:#D93025;
  --auth-paste:#37837C1F; --auth-ai:#A9691F24;
  --shadow:0 1px 2px rgba(20,24,26,.05), 0 12px 32px -12px rgba(20,24,26,.18);
  --ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --speed:.28s; --ease:cubic-bezier(.2,.7,.3,1);
}
[data-theme="dark"]{
  --paper:#000000; --paper-2:#0A0A0A; --panel:#0D0D0D; --rule:#242424;
  --ink:#EDEDED; --ink-soft:#9B9B9B; --ink-faint:#666666; --dim:#3A3A3A;
  --accent:#7EA6D8; --accent-soft:#7EA6D826; --flag:#D6A05A; --caret:#4CC3F0;
  --pos-noun:#89B4DC; --pos-verb:#DE9679; --pos-adj:#A8C687;
  --pos-adv:#BFA0DA; --pos-conj:#9C9C9C; --pos-prep:#7FCCC4; --pos-pron:#E0899C;
  --sc-cliche:#E0685C; --sc-passive:#C39AE8; --sc-adverb:#E0A15E; --sc-filler:#7A7A7A;
  --sc-wordy:#4CC3B8; --sc-redundant:#E876B0; --sc-weak:#A8C87A; --sc-repeat:#6FA8DC;
  --sc-long:rgba(214,160,90,.10); --sp-error:#FF6B6B;
  --auth-paste:#7FCCC41C; --auth-ai:#D6A05A22;
  --shadow:0 0 0 1px rgba(255,255,255,.04), 0 18px 40px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--ui);
  -webkit-font-smoothing:antialiased; overflow:hidden;
  transition:background var(--speed) var(--ease), color var(--speed) var(--ease);
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
#ed:focus,#ed:focus-visible{outline:none;box-shadow:none}
[data-caret="block"] #ed{caret-color:transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:20px;border:3px solid var(--paper)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:0 1fr;height:100vh;transition:grid-template-columns var(--speed) var(--ease)}
.app.sidebar-open{grid-template-columns:272px 1fr}
@media (max-width:820px){ .app.sidebar-open{grid-template-columns:0 1fr} .app.sidebar-open .sidebar{transform:none;box-shadow:var(--shadow)} }

/* ---------- sidebar ---------- */
.sidebar{
  position:relative;z-index:40;height:100vh;width:272px;background:var(--panel);
  border-right:1px solid var(--rule);display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform var(--speed) var(--ease);
}
.app.sidebar-open .sidebar{transform:none}
@media (max-width:820px){ .sidebar{position:fixed;left:0;top:0} }
.side-head{padding:18px 16px 10px;display:flex;align-items:center;gap:8px}
.wordmark{font-family:var(--mono);font-size:16px;font-weight:500;letter-spacing:-.02em}
.wordmark i{font-style:normal;color:var(--accent)}
.side-actions{margin-left:auto;display:flex;gap:2px}
.icon-btn{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--ink-soft);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--paper);color:var(--ink)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.search-wrap{padding:4px 12px 10px}
.search{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:7px;padding:7px 10px;font-size:13px}
.search::placeholder{color:var(--ink-faint)}
.tree{flex:1;overflow-y:auto;padding:2px 8px 20px}
.group-label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);padding:14px 8px 6px;font-weight:500}
.row{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--ink-soft);position:relative;user-select:none}
.row:hover{background:var(--paper)}
.row.active{background:var(--paper);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
.row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .glyph{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.row .more{opacity:0;width:20px;height:20px;display:grid;place-items:center;border-radius:5px;flex:none;color:var(--ink-faint)}
.row:hover .more{opacity:1}
.row .more:hover{background:var(--rule)}
.row.drop{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.row.dragging{opacity:.4}
.children{margin-left:13px;border-left:1px solid var(--rule);padding-left:4px}
.pill{font-size:10px;padding:1px 6px;border-radius:20px;background:var(--rule);color:var(--ink-soft)}
.empty-note{padding:10px;font-size:12.5px;color:var(--ink-faint);line-height:1.6}

/* ---------- main ---------- */
.main{position:relative;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.topbar{
  position:absolute;top:0;left:0;right:0;height:52px;z-index:20;display:flex;align-items:center;gap:4px;
  padding:0 14px;opacity:0;transition:opacity var(--speed) var(--ease);pointer-events:none;
  background:linear-gradient(var(--paper) 55%,transparent);
}
.topbar.show{opacity:1;pointer-events:auto}
.doc-title{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);margin-left:6px;max-width:40ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.seg{display:flex;background:var(--panel);border-radius:8px;padding:2px;gap:2px}
.seg button{font-size:12px;padding:4px 11px;border-radius:6px;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- writing surface ---------- */
.scroll{flex:1;overflow-y:auto}
.canvas{max-width:var(--measure,68ch);margin:0 auto;padding:16vh 28px 46vh;position:relative}
.caret{position:absolute;left:0;top:0;width:3px;border-radius:1px;background:var(--caret);pointer-events:none;display:none;z-index:2;will-change:transform}
.caret.blink{animation:caret-blink 1.1s steps(1,end) infinite}
@keyframes caret-blink{0%,55%{opacity:1}56%,100%{opacity:0}}
#ed{
  font-family:var(--font,var(--serif));font-size:var(--fs,19px);line-height:var(--lh,1.72);
  white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:2;
  color:var(--ink);caret-color:var(--caret);min-height:62vh;
}
#ed[data-empty="true"]::before{content:attr(data-ph);color:var(--ink-faint);pointer-events:none}
#ed ::selection,#ed::selection{background:var(--accent-soft)}

/* live markdown formatting */
.md-h1{font-size:1.75em;font-weight:600;letter-spacing:-.015em}
.md-h2{font-size:1.42em;font-weight:600;letter-spacing:-.01em}
.md-h3{font-size:1.2em;font-weight:600}
.md-h4,.md-h5,.md-h6{font-weight:600}
.md-strong{font-weight:700}
.md-em{font-style:italic}
.md-del{text-decoration:line-through;opacity:.55}
.md-code{font-family:var(--mono);font-size:.88em;color:var(--pos-prep)}
.md-fence{font-family:var(--mono);font-size:.88em;color:var(--ink-soft)}
.md-quote{font-style:italic;color:var(--ink-soft)}
.md-marker{color:var(--accent);font-weight:600}
.md-link{color:var(--accent)}
.md-rule{color:var(--ink-faint);letter-spacing:.3em}
.md-syntax{opacity:.32;font-weight:400;font-style:normal;text-decoration:none}

/* parts of speech */
.pos-noun{color:var(--pos-noun)} .pos-verb{color:var(--pos-verb)} .pos-adj{color:var(--pos-adj)}
.pos-adv{color:var(--pos-adv)} .pos-conj{color:var(--pos-conj)} .pos-prep{color:var(--pos-prep)}
.pos-pron{color:var(--pos-pron)}

/* style check — colour, not underline */
.sc-cliche{color:var(--sc-cliche)}
.sc-passive{color:var(--sc-passive)}
.sc-adverb{color:var(--sc-adverb)}
.sc-filler{color:var(--sc-filler)}
.sc-wordy{color:var(--sc-wordy)}
.sc-redundant{color:var(--sc-redundant)}
.sc-weak{color:var(--sc-weak)}
.sc-repeat{color:var(--sc-repeat)}
.sc-long{background:var(--sc-long);border-radius:3px}

/* spelling — colour, never a squiggle */
.sp-error{color:var(--sp-error)}

/* authorship + find */
.auth-paste{background:var(--auth-paste);border-radius:2px}
.auth-ai{background:var(--auth-ai);border-radius:2px}
.match{background:var(--accent-soft);border-radius:2px}
.match.current{background:var(--flag);color:var(--paper)}

/* focus mode wins over every colour */
.dim{color:var(--dim) !important;transition:color .3s var(--ease)}
.dim.auth-paste,.dim.auth-ai,.dim.sc-long{background:none !important}

/* ---------- grain ribbon ---------- */
.ribbon{
  position:fixed;left:calc(50% - var(--half,34ch) - 34px);top:16vh;bottom:16vh;width:5px;border-radius:3px;
  background:var(--rule);overflow:hidden;opacity:0;transition:opacity var(--speed) var(--ease);z-index:5;
}
.app.sidebar-open .ribbon{left:calc(50% + 136px - var(--half,34ch) - 34px)}
@media (max-width:1100px){.ribbon{display:none}}
.ribbon.on{opacity:1}
.ribbon i{display:block;width:100%}
.ribbon .seg-typed{background:var(--ink-faint)}
.ribbon .seg-paste{background:var(--pos-prep)}
.ribbon .seg-ai{background:var(--flag)}
.ribbon-key{position:absolute;left:14px;top:0;font-size:10.5px;color:var(--ink-faint);white-space:nowrap;opacity:0;transition:opacity .2s}
.ribbon:hover .ribbon-key{opacity:1}

/* ---------- preview ---------- */
.preview{max-width:var(--measure,68ch);margin:0 auto;padding:16vh 28px 40vh;font-family:var(--font,var(--serif));font-size:var(--fs,19px);line-height:var(--lh,1.72)}
.preview h1,.preview h2,.preview h3,.preview h4{font-weight:600;line-height:1.25;margin:1.9em 0 .6em}
.preview h1{font-size:1.75em;letter-spacing:-.015em} .preview h2{font-size:1.42em} .preview h3{font-size:1.2em}
.preview h4{font-size:1em;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-soft)}
.preview p{margin:0 0 1.15em} .preview ul,.preview ol{margin:0 0 1.15em;padding-left:1.4em}
.preview li{margin:.3em 0} .preview li.task{list-style:none;margin-left:-1.2em}
.preview li.task input{margin-right:.5em;accent-color:var(--accent)}
.preview blockquote{margin:1.4em 0;padding-left:1.1em;border-left:2px solid var(--accent);color:var(--ink-soft);font-style:italic}
.preview code{font-family:var(--mono);font-size:.86em;background:var(--panel);padding:.12em .35em;border-radius:4px}
.preview pre{background:var(--panel);padding:14px 16px;border-radius:9px;overflow-x:auto;margin:1.4em 0}
.preview pre code{background:none;padding:0;font-size:.82em;line-height:1.6}
.preview hr{border:0;border-top:1px solid var(--rule);margin:2.4em 0}
.preview a{color:var(--accent);text-underline-offset:3px}
.preview img{max-width:100%;border-radius:8px}
.preview table{border-collapse:collapse;width:100%;margin:1.4em 0;font-size:.9em}
.preview th,.preview td{border:1px solid var(--rule);padding:7px 11px;text-align:left}
.preview th{background:var(--panel);font-weight:500}

/* ---------- status bar ---------- */
.status{
  position:absolute;bottom:0;left:0;right:0;height:38px;display:flex;align-items:center;gap:16px;
  padding:0 18px;font-size:11.5px;color:var(--ink-faint);z-index:15;font-family:var(--mono);
  background:linear-gradient(transparent,var(--paper) 60%);opacity:0;transition:opacity var(--speed) var(--ease);pointer-events:none
}
.status.show{opacity:1;pointer-events:auto}
.status button{color:inherit;font-size:11.5px;font-family:var(--mono)}
.status button:hover{color:var(--ink)}
.status .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}

/* ---------- floating panels ---------- */
.panel{
  position:absolute;z-index:60;background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  box-shadow:var(--shadow);opacity:0;transform:translateY(-6px) scale(.99);pointer-events:none;
  transition:opacity .18s var(--ease),transform .18s var(--ease)
}
.panel.open{opacity:1;transform:none;pointer-events:auto}
.panel h3{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:500}

#findbar{top:58px;right:20px;width:340px;padding:12px}
#findbar .line{display:flex;gap:6px;align-items:center;margin-bottom:6px}
#findbar input{flex:1;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:6px 9px;font-size:13px}
#findbar .count{font-size:11px;color:var(--ink-faint);min-width:52px;text-align:right;font-family:var(--mono)}
.mini{font-size:11.5px;padding:5px 9px;border-radius:6px;background:var(--paper);border:1px solid var(--rule);color:var(--ink-soft)}
.mini:hover{color:var(--ink);border-color:var(--ink-faint)}

#stylepanel{top:58px;right:20px;width:352px;max-height:72vh;display:flex;flex-direction:column}
.panel-head{display:flex;align-items:center;gap:8px;padding:13px 14px;border-bottom:1px solid var(--rule)}
.panel-body{overflow-y:auto;padding:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;padding:9px 14px;border-bottom:1px solid var(--rule);font-size:10.5px;font-family:var(--mono)}
.legend span{display:flex;align-items:center;gap:4px;color:var(--ink-faint)}
.legend b{font-weight:500}
.issue{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.issue:hover{background:var(--paper)}
.issue b{font-weight:500;color:var(--ink)}
.issue .kind{font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px;font-family:var(--mono)}
.readout{display:flex;gap:14px;padding:10px 14px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink-faint)}
.readout b{display:block;font-size:15px;color:var(--ink);font-weight:400;font-family:var(--mono)}

#settings{top:0;right:0;bottom:0;width:380px;border-radius:0;border-top:0;border-bottom:0;transform:translateX(12px);max-width:92vw}
#settings.open{transform:none}
.sheet-body{overflow-y:auto;height:calc(100% - 52px);padding:6px 20px 40px}
.set{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule)}
.set:last-child{border-bottom:0}
.set label{font-size:13px;flex:1}
.set label small{display:block;color:var(--ink-faint);font-size:11.5px;margin-top:2px;line-height:1.4}
.set select,.set input[type=number]{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:5px 8px;font-size:12.5px;min-width:104px}
.set input[type=range]{width:132px;accent-color:var(--accent)}
.set .val{font-size:11.5px;color:var(--ink-faint);min-width:38px;text-align:right;font-family:var(--mono)}
.switch{width:38px;height:22px;border-radius:20px;background:var(--rule);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--paper);transition:transform .2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
[data-theme="dark"] .switch::after{background:#3A3A3A}
.switch[aria-pressed="true"]{background:var(--accent)}
.switch[aria-pressed="true"]::after{transform:translateX(16px);background:var(--paper)}
.section-title{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin:22px 0 2px;font-weight:500}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--paper);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-soft)}
.keyrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12.5px;color:var(--ink-soft)}

#palette{top:14vh;left:50%;transform:translate(-50%,-6px) scale(.99);width:min(560px,92vw);padding:0;overflow:hidden}
#palette.open{transform:translate(-50%,0)}
#palette input{width:100%;background:none;border:0;padding:16px 18px;font-size:14px;border-bottom:1px solid var(--rule);font-family:var(--mono)}
#palette input:focus{outline:none}
.pal-list{max-height:46vh;overflow-y:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:13.5px;color:var(--ink-soft)}
.pal-item.sel,.pal-item:hover{background:var(--paper);color:var(--ink)}
.pal-item .hint{margin-left:auto;font-size:11px;color:var(--ink-faint);font-family:var(--mono)}

#ctx{position:absolute;z-index:80;min-width:172px;padding:5px}
#ctx button{display:block;width:100%;text-align:left;padding:7px 11px;border-radius:6px;font-size:13px;color:var(--ink-soft)}
#ctx button:hover{background:var(--paper);color:var(--ink)}
#ctx hr{border:0;border-top:1px solid var(--rule);margin:5px 6px}
#ctx .danger:hover{color:#C4453F}

#toast{
  position:absolute;bottom:52px;left:50%;transform:translate(-50%,10px);z-index:70;
  background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);
  padding:9px 12px;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:10px;
  opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease)
}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.backdrop-veil{position:fixed;inset:0;background:rgba(0,0,0,.14);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.backdrop-veil.on{opacity:1;pointer-events:auto}
[data-theme="dark"] .backdrop-veil{background:rgba(0,0,0,.6)}
.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important}.caret.blink{animation:none !important;opacity:1}}
@media print{body{overflow:visible}.sidebar,.topbar,.status,.panel,.ribbon{display:none !important}}
</style>
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar" id="sidebar" aria-label="Documents">
    <div class="side-head">
      <span class="wordmark">type<i>.</i></span>
      <div class="side-actions">
        <button class="icon-btn" id="newFolderBtn" title="New folder" aria-label="New folder">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v4M10 13h4"/></svg>
        </button>
        <button class="icon-btn" id="newDocBtn" title="New document (⌘N)" aria-label="New document">
          <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></svg>
        </button>
      </div>
    </div>
    <div class="search-wrap">
      <input class="search" id="sideSearch" type="search" placeholder="Search titles, text, #tags" aria-label="Search documents">
    </div>
    <div class="tree" id="tree"></div>
  </aside>

  <main class="main" id="main">
    <div class="topbar" id="topbar">
      <button class="icon-btn" id="toggleSidebar" title="Toggle sidebar (⌘\)" aria-label="Toggle sidebar">
